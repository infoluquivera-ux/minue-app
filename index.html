<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MINUÉ Distribución</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MINUÉ">
  <style>
  /* ==================================================================
     MINUÉ · sistema de diseño (docs/diseno/03-sistema-de-diseno.md)
     Nivel 1: paleta global (piedra cálida, ámbar, verde, rojo)
     Nivel 2: tokens semánticos (--c-*): lo único que usan los componentes
     Nivel 3: tokens de componente (--btn-*, --hero-*)
     ================================================================== */
  :root {
    /* Nivel 1 · paleta global */
    --stone-50: #FAFAF9; --stone-100: #F5F5F4; --stone-200: #E7E5E4; --stone-300: #D6D3D1; --stone-400: #A8A29E;
    --stone-500: #78716C; --stone-600: #57534E; --stone-700: #44403C; --stone-800: #292524; --stone-900: #1C1917; --stone-950: #0C0A09;
    --amber-100: #FEF3C7; --amber-300: #FCD34D; --amber-400: #FBBF24; --amber-500: #F59E0B; --amber-600: #D97706;
    --amber-700: #B45309; --amber-900: #78350F; --amber-950: #451A03;
    --green-300: #86EFAC; --green-100: #DCFCE7; --green-800: #166534; --green-950: #052E16;
    --red-100: #FEE2E2; --red-300: #FCA5A5; --red-700: #B91C1C; --red-950: #450A0A;

    /* Nivel 2 · semánticos (claro) */
    --c-bg: var(--stone-100);
    --c-surface: #FFFFFF;
    --c-sunken: var(--stone-100);
    --c-text: var(--stone-900);
    --c-muted: var(--stone-600);
    --c-border: var(--stone-200);
    --c-control: var(--stone-500);
    --c-action: var(--stone-900);
    --c-action-press: var(--stone-700);
    --c-on-action: var(--stone-50);
    --c-accent: var(--amber-600);
    --c-progress: var(--amber-700);
    --c-accent-soft: var(--amber-100);
    --c-on-accent-soft: var(--amber-900);
    --c-success: var(--green-800);
    --c-success-soft: var(--green-100);
    --c-danger: var(--red-700);
    --c-danger-soft: var(--red-100);
    --c-warn: var(--amber-900);
    --c-warn-soft: var(--amber-100);
    --c-focus: var(--amber-700);
    --c-scrim: rgba(28, 25, 23, .5);
    --c-inverse-bg: var(--stone-900);
    --c-inverse-text: var(--stone-50);
    --c-inverse-muted: var(--stone-300);
    --c-inverse-kicker: var(--amber-400);
    --c-inverse-border: var(--stone-500);
    --c-inverse-chip: var(--stone-700);
    --c-inverse-late-bg: #5A1F1F;
    --c-inverse-late-text: #FFD7D7;
    --c-brand-black: #000000;
    --c-skeleton-a: var(--stone-200);
    --c-skeleton-b: var(--stone-100);

    /* Tipografía, espacio, forma, sombra, movimiento */
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --fs-body: 17px; --fs-small: 16px; --fs-title: 26px; --fs-hero: 28px; --fs-money: 22px; --fs-big: 34px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-full: 999px;
    --sh-sm: 0 1px 2px rgba(28, 25, 23, .06);
    --sh-md: 0 8px 24px rgba(28, 25, 23, .16);
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-pop: cubic-bezier(.175, .885, .32, 1.275);
    --dur-quick: .12s; --dur-std: .24s; --dur-slow: .4s;
    --tap: 56px;
    --nav-h: 68px;
    --zoom: 1;

    /* Nivel 3 · componentes */
    --btn-radius: var(--r-lg);
    --card-radius: var(--r-lg);
    --hero-radius: var(--r-xl);
  }

  /* Modo oscuro automático (sigue al teléfono) */
  @media (prefers-color-scheme: dark) {
    :root {
      --c-bg: var(--stone-950);
      --c-surface: var(--stone-900);
      --c-sunken: var(--stone-800);
      --c-text: var(--stone-50);
      --c-muted: var(--stone-400);
      --c-border: var(--stone-800);
      --c-control: var(--stone-500);
      --c-action: var(--stone-50);
      --c-action-press: var(--stone-300);
      --c-on-action: var(--stone-900);
      --c-accent: var(--amber-500);
      --c-progress: var(--amber-500);
      --c-accent-soft: var(--amber-950);
      --c-on-accent-soft: var(--amber-300);
      --c-success: var(--green-300);
      --c-success-soft: var(--green-950);
      --c-danger: var(--red-300);
      --c-danger-soft: var(--red-950);
      --c-warn: var(--amber-300);
      --c-warn-soft: var(--amber-950);
      --c-focus: var(--amber-400);
      --c-scrim: rgba(0, 0, 0, .65);
      --c-inverse-bg: var(--stone-800);
      --c-skeleton-a: var(--stone-800);
      --c-skeleton-b: var(--stone-700);
      --sh-md: 0 8px 24px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
  body {
    margin: 0; background: var(--c-bg); color: var(--c-text);
    font: var(--fs-body)/1.5 var(--font);
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 8px; top: 8px; background: var(--c-surface); padding: 8px; z-index: 99; }
  :focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Barra superior */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding: 10px var(--sp-4); background: var(--c-surface); border-bottom: 1px solid var(--c-border);
  }
  .brand { font-weight: 700; letter-spacing: .12em; font-size: 20px; }
  .brand i { font-style: normal; color: var(--c-accent); }
  .brand-logo { display: block; height: 32px; width: auto; border-radius: 8px; background: var(--c-brand-black); }
  .topbar-right { display: flex; align-items: center; gap: var(--sp-2); }
  .sync { display: inline-flex; align-items: center; gap: 6px; color: var(--c-muted); font-size: 15px; }
  .sync .spinner { width: 14px; height: 14px; border-width: 2px; }
  .net { background: var(--c-danger-soft); color: var(--c-danger); font-weight: 600; padding: 6px 10px; border-radius: var(--r-full); font-size: var(--fs-small); }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 var(--sp-3); border-radius: var(--r-md);
    border: 1px solid var(--c-border); background: var(--c-surface); font-weight: 600; font-size: var(--fs-small); cursor: pointer;
    transition: background-color var(--dur-quick) var(--ease);
  }
  .icon-btn:active { background: var(--c-sunken); }

  main, .sheet-inner { zoom: var(--zoom); }
  main { max-width: 640px; margin: 0 auto; padding: var(--sp-4); outline: none; }
  h1 { font-size: var(--fs-title); line-height: 1.2; margin: var(--sp-1) 0; letter-spacing: -.02em; font-weight: 700; }
  h2 { font-size: 20px; margin: var(--sp-6) 0 10px; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--c-muted); margin: 0 0 var(--sp-4); }
  .small { font-size: var(--fs-small); color: var(--c-muted); }
  .money { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Tarjetas */
  .card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--card-radius); padding: var(--sp-4); box-shadow: var(--sh-sm); }
  .card + .card { margin-top: var(--sp-3); }

  /* Botones */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: var(--tap);
    padding: 12px 18px; border-radius: var(--btn-radius); border: 2px solid transparent; font-weight: 700; font-size: 18px;
    text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform var(--dur-quick) var(--ease), background-color var(--dur-quick) var(--ease), border-color var(--dur-quick) var(--ease);
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--c-action); color: var(--c-on-action); }
  .btn.primary:active { background: var(--c-action-press); }
  .btn.secondary { background: var(--c-surface); color: var(--c-text); border-color: var(--c-control); }
  .btn.secondary.strong { border-color: var(--c-action); }
  .btn.ghost { background: transparent; color: var(--c-text); min-height: 48px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .btn.done { background: var(--c-success-soft); color: var(--c-success); border-color: var(--c-success); }
  .btn-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  .btn-row .btn { padding: 10px 8px; gap: 6px; font-size: var(--fs-body); }
  .stack > * + * { margin-top: 10px; }
  .spinner { width: 20px; height: 20px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Etiquetas de estado */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: var(--r-full); font-size: var(--fs-small); font-weight: 600; background: var(--c-sunken); color: var(--c-muted); }
  .badge.next { background: var(--c-accent-soft); color: var(--c-on-accent-soft); }
  .badge.late, .badge.crit { background: var(--c-danger-soft); color: var(--c-danger); }
  .badge.urgent { background: var(--c-warn-soft); color: var(--c-warn); }
  .badge.ok { background: var(--c-success-soft); color: var(--c-success); }

  .info { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 12px 0 4px; }
  .info dt { color: var(--c-muted); }
  .info dd { margin: 0; font-weight: 600; }
  .note { background: var(--c-warn-soft); color: var(--c-warn); border-radius: 10px; padding: 8px var(--sp-3); margin-top: var(--sp-2); }

  /* Listas */
  .list-item { display: block; width: 100%; text-align: left; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--card-radius); padding: 14px var(--sp-4); cursor: pointer; box-shadow: var(--sh-sm); transition: background-color var(--dur-quick) var(--ease); }
  .list-item:active { background: var(--c-sunken); }
  .list-item + .list-item { margin-top: 10px; }
  .list-item .row { display: flex; justify-content: space-between; gap: var(--sp-3); align-items: baseline; }
  .list-item strong { font-size: 18px; font-weight: 600; }
  .owe { color: var(--c-danger); font-weight: 700; white-space: nowrap; }
  .paid { color: var(--c-success); font-weight: 700; white-space: nowrap; }
  .empty { text-align: center; padding: 28px var(--sp-4); color: var(--c-muted); }
  .empty strong { display: block; color: var(--c-text); font-size: 20px; margin-bottom: 6px; }

  /* Formularios */
  label.field { display: block; margin-top: 14px; }
  label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
  .input, select.input, textarea.input {
    width: 100%; min-height: var(--tap); padding: 12px 14px; border: 2px solid var(--c-control); border-radius: var(--r-md); background: var(--c-surface); font-size: 18px;
  }
  .input:focus { border-color: var(--c-focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-focus) 30%, transparent); }
  textarea.input { min-height: 88px; resize: vertical; }
  .search { position: relative; }
  .search .input { padding-left: 46px; }
  .search svg { position: absolute; left: 14px; top: 16px; color: var(--c-muted); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .chip { min-height: 48px; padding: 8px var(--sp-4); border-radius: var(--r-md); border: 2px solid var(--c-control); background: var(--c-surface); font-weight: 600; cursor: pointer; transition: background-color var(--dur-quick) var(--ease), color var(--dur-quick) var(--ease); }
  .chip[aria-pressed="true"] { border-color: var(--c-action); background: var(--c-action); color: var(--c-on-action); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .step { margin-top: 18px; }
  .step-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  .step-num { width: 32px; height: 32px; border-radius: 50%; background: var(--c-action); color: var(--c-on-action); display: grid; place-items: center; font-size: var(--fs-small); }
  .product { padding: var(--sp-3) 0; border-top: 1px solid var(--c-border); }
  .product:first-child { border-top: 0; }
  .product-name { font-weight: 600; }
  .product-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: var(--sp-2); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 2px solid var(--c-control); border-radius: var(--r-md); overflow: hidden; }
  .seg button { min-height: 44px; padding: 0 var(--sp-3); border: 0; background: var(--c-surface); font-weight: 600; font-size: var(--fs-small); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--c-action); color: var(--c-on-action); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button { width: 48px; height: 48px; border-radius: var(--r-md); border: 2px solid var(--c-control); background: var(--c-surface); font-size: 24px; font-weight: 700; cursor: pointer; }
  .stepper button:active { transform: scale(.94); }
  .stepper input { width: 64px; height: 48px; text-align: center; border: 2px solid var(--c-control); border-radius: var(--r-md); font-size: 20px; font-weight: 700; background: var(--c-surface); }
  .product.selected .product-name { text-decoration: underline; text-decoration-color: var(--c-accent); text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .line-total { font-size: var(--fs-small); color: var(--c-muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .totalbar {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 15;
    background: var(--c-surface); border-top: 1px solid var(--c-border); padding: 10px var(--sp-4); box-shadow: 0 -4px 16px rgba(28, 25, 23, .06);
  }
  .totalbar-inner { max-width: 640px; margin: 0 auto; display: flex; gap: var(--sp-3); align-items: center; }
  .totalbar .sum { flex: none; }
  .totalbar .sum div:first-child { font-size: var(--fs-small); color: var(--c-muted); }
  .totalbar .sum div:last-child { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .totalbar .btn { flex: 1; }
  .has-totalbar { padding-bottom: 96px; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; border: 0; background: none; color: var(--c-text); font-weight: 600; padding: 0; cursor: pointer; }

  /* Navegación inferior */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--c-surface); border-top: 1px solid var(--c-border);
  }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--c-muted); font-size: 15px; font-weight: 600; cursor: pointer; min-width: 0; padding: 0 2px; transition: color var(--dur-quick) var(--ease); }
  .tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tab[aria-current="page"] { color: var(--c-text); }
  .tab[aria-current="page"] svg { stroke-width: 2.6; }
  .tab[aria-current="page"] span { box-shadow: 0 3px 0 var(--c-accent); }

  /* Hoja inferior */
  .backdrop { position: fixed; inset: 0; background: var(--c-scrim); z-index: 40; animation: fade var(--dur-std) var(--ease); }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 92vh; overflow: auto;
    background: var(--c-surface); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: var(--sp-5) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom));
    box-shadow: var(--sh-md); animation: sheet-up var(--dur-std) var(--ease);
  }
  .sheet-inner { max-width: 600px; margin: 0 auto; }
  .sheet h2 { margin-top: 0; font-size: 22px; }
  .big-amount { font-size: var(--fs-big); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .summary { background: var(--c-sunken); border-radius: var(--r-md); padding: var(--sp-3) 14px; margin: var(--sp-3) 0; }
  .summary .row { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 4px 0; }

  /* Avisos */
  .toast {
    position: fixed; left: var(--sp-4); right: var(--sp-4); top: calc(12px + env(safe-area-inset-top)); z-index: 60;
    max-width: 600px; margin: 0 auto; background: var(--stone-900); color: var(--stone-50); border-radius: var(--r-lg); padding: 14px var(--sp-4);
    display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); box-shadow: var(--sh-md);
    animation: toast-in var(--dur-std) var(--ease);
  }
  .toast.error { background: var(--red-700); color: #fff; }
  .toast button { background: none; border: 2px solid rgba(255, 255, 255, .7); color: inherit; border-radius: 10px; min-height: 44px; padding: 0 14px; font-weight: 700; cursor: pointer; }
  .outbox { max-width: 640px; margin: var(--sp-3) auto 0; padding: 0 var(--sp-4); }
  .outbox .card { border-color: var(--c-accent); background: var(--c-warn-soft); color: var(--c-warn); }
  .banner { background: var(--c-accent-soft); color: var(--c-on-accent-soft); border-radius: var(--r-md); padding: var(--sp-3) 14px; margin-bottom: 14px; }
  .error-box { background: var(--c-danger-soft); color: var(--c-danger); border-radius: var(--r-md); padding: var(--sp-3) 14px; margin-top: var(--sp-3); font-weight: 600; animation: shake .3s var(--ease); }
  .skeleton { height: 88px; border-radius: var(--card-radius); background: linear-gradient(90deg, var(--c-skeleton-a) 25%, var(--c-skeleton-b) 50%, var(--c-skeleton-a) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  .skeleton + .skeleton { margin-top: var(--sp-3); }
  .demo-flag { background: var(--stone-900); color: var(--amber-300); text-align: center; font-weight: 600; padding: 6px var(--sp-3); font-size: var(--fs-small); }

  /* Hoy */
  .welcome { font-size: 24px; font-weight: 700; margin: var(--sp-1) 0 0; line-height: 1.2; letter-spacing: -.02em; }
  .greet { color: var(--c-muted); margin: 2px 0 6px; }
  .late-line { color: var(--c-danger); font-weight: 600; margin: 0 0 var(--sp-2); }
  .bar { height: 8px; background: var(--c-border); border-radius: 4px; margin: var(--sp-2) 0 14px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c-progress); border-radius: 4px; transition: width var(--dur-slow) var(--ease); }
  .pills { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }
  .pill { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); flex: 1 1 140px; box-shadow: var(--sh-sm); }
  .pill span { display: block; font-size: 15px; color: var(--c-muted); }
  .pill b { display: block; font-size: var(--fs-money); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero { background: var(--c-inverse-bg); color: var(--c-inverse-text); border-radius: var(--hero-radius); padding: 18px; box-shadow: var(--sh-md); }
  .hero-top { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
  .hero-kicker { color: var(--c-inverse-kicker); font-size: 15px; font-weight: 600; }
  .hchip { background: var(--c-inverse-chip); color: var(--c-inverse-text); border-radius: var(--r-full); padding: 2px 10px; font-size: 15px; font-weight: 600; }
  .hchip.late { background: var(--c-inverse-late-bg); color: var(--c-inverse-late-text); }
  .hero-name { font-size: var(--fs-hero); font-weight: 700; line-height: 1.15; margin: var(--sp-2) 0 2px; color: var(--c-inverse-text); letter-spacing: -.02em; }
  .hero-addr { color: var(--c-inverse-muted); margin: 0 0 6px; }
  .hero-info { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0; }
  .hero-info dt { color: var(--c-inverse-muted); }
  .hero-info dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero .note { margin: var(--sp-2) 0; }
  .hero-primary { background: var(--stone-50); color: var(--stone-900); min-height: 64px; font-size: 21px; margin-top: var(--sp-3); }
  .hero-primary:active { background: var(--stone-200); }
  .btn.hero-sec { background: transparent; color: var(--c-inverse-text); border-color: var(--c-inverse-border); min-height: 52px; margin-top: 10px; font-size: var(--fs-small); }
  .hero-tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  .btn.tile { flex-direction: column; gap: 4px; min-height: 64px; margin-top: 0; padding: 8px 4px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.2; }
  .after { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--card-radius); margin-top: 10px; box-shadow: var(--sh-sm); }
  .after-head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); width: 100%; text-align: left; background: none; border: 0; padding: 14px var(--sp-4); cursor: pointer; min-height: 64px; }
  .after-body { padding: 0 var(--sp-4) 14px; }
  .after-body > * + * { margin-top: 10px; }
  .late-text { color: var(--c-danger); font-weight: 600; }
  .repeat { background: var(--c-accent-soft); border-radius: var(--r-md); padding: var(--sp-3); margin: var(--sp-2) 0; }
  .repeat .small { color: var(--c-on-accent-soft); margin-bottom: var(--sp-2); }
  .fab { position: fixed; right: var(--sp-4); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); z-index: 25; display: inline-flex; align-items: center; gap: var(--sp-2); background: var(--c-surface); color: var(--c-text); border: 2px solid var(--c-action); border-radius: var(--r-full); padding: 12px 20px; font-size: 18px; font-weight: 700; cursor: pointer; min-height: 56px; box-shadow: var(--sh-md); transition: transform var(--dur-quick) var(--ease); }
  .fab:active { transform: scale(.96); }
  main.with-fab { padding-bottom: 104px; }

  /* Éxito: el momento de cierre se diseña a propósito */
  .success-mark { width: 56px; height: 56px; margin: 0 auto var(--sp-3); color: var(--c-success); animation: pop var(--dur-std) var(--ease-pop) both; }
  .success-mark svg { width: 56px; height: 56px; stroke-width: 2.4; }
  .check-circle { stroke-dasharray: 76; stroke-dashoffset: 76; animation: draw .32s var(--ease) .05s forwards; }
  .check-tick { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .24s var(--ease) .25s forwards; }
  .centered { text-align: center; }

  /* Movimiento: una sola curva, tres duraciones; entra desde abajo y se desvanece */
  .enter > *, main:not(.no-anim) .hero, main:not(.no-anim) .after, main:not(.no-anim) .card, main:not(.no-anim) .pill, main:not(.no-anim) .list-item {
    animation: rise var(--dur-std) var(--ease) both;
  }
  main:not(.no-anim) .after, main:not(.no-anim) .list-item { animation-delay: calc(var(--i, 0) * 35ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  @keyframes toast-in { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  @media (min-width: 720px) {
    main { padding: var(--sp-6); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; animation-delay: 0s !important; }
    .check-circle, .check-tick { stroke-dashoffset: 0; }
  }
</style>

  .login { position: fixed; inset: 0; z-index: 50; background: var(--c-brand-black); color: var(--c-inverse-text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-4); padding: var(--sp-6); text-align: center; }
  .login[hidden] { display: none; }
  .login h1 { font-size: var(--fs-title); margin: 0; }
  .login-logo { border-radius: var(--r-xl); }
  .login-msg { color: var(--c-inverse-muted); margin: 0; max-width: 320px; }
  .login-btn { min-height: 48px; }
</style>

  /** Crea elementos de forma segura (sin innerHTML con datos). */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (key) {
      var value = attrs[key];
      if (value === null || value === undefined || value === false) return;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key === 'href') {
        var safe = safeHref(value);
        if (safe) node.setAttribute('href', safe);
      } else if (key.indexOf('on') === 0) node.addEventListener(key.slice(2), value);
      else if (key === 'value') node.value = value;
      else node.setAttribute(key, value === true ? '' : value);
    });
    [].concat(children || []).forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      node.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
    });
    return node;
  }

  var moneyFormat = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function money(n) {
    return moneyFormat.format(Math.round((Number(n) || 0) * 100) / 100).replace(/\u00a0/g, ' ');
  }

  /** Igual criterio que el servidor: "15.000", "$ 15.000,50", "15000.5". Devuelve null si no es válido. */
  function parseMoney(value) {
    if (value === null || value === undefined) return null;
    var text = String(value).replace(/[$\s]/g, '');
    if (!text) return null;
    if (!/^[\d.,]+$/.test(text)) return null;
    if (text.indexOf(',') !== -1) text = text.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(text)) text = text.replace(/\./g, '');
    var n = Number(text);
    return isFinite(n) ? Math.round(n * 100) / 100 : null;
  }

  function todayKey(offsetDays) {
    var d = new Date(Date.now() + (offsetDays || 0) * 86400000);
    var p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    return p;
  }

  function dayLabel(key) {
    if (!key) return 'Sin fecha';
    if (key === todayKey()) return 'Hoy';
    if (key === todayKey(1)) return 'Mañana';
    if (key === todayKey(-1)) return 'Ayer';
    var parts = key.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    var days = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    var months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return days[d.getDay()] + ' ' + Number(parts[2]) + ' ' + months[Number(parts[1]) - 1];
  }

  function capital(text) {
    text = String(text || '');
    return text.charAt(0).toUpperCase() + text.slice(1);
  }

  function nice(text) {
    return String(text || '').toLowerCase().replace(/(^|\s)\S/g, function (s) { return s.toUpperCase(); });
  }

  function norm(text) {
    return String(text || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function store(key, value) {
    try {
      if (value === undefined) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));

  var NETWORK_ERROR = { code: 'NETWORK', message: 'No hay conexión o la respuesta tardó demasiado.' };

        headers: { 'Content-Type': 'text/plain;charset=utf-8' },

        if (res && res.ok) return res.data;
        if (res && res.code === 'AUTH' && !retried) {

      }, function () {

        throw NETWORK_ERROR;
      });
    }, function (error) {
      throw error && error.code ? error : NETWORK_ERROR;
    });
  }

    return new Promise(function (resolve, reject) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        reject(NETWORK_ERROR);

          })

            if (done) return;

        reject(NETWORK_ERROR);

  function outbox() { return load('minue.bandeja', []); }

  function outboxPut(item) {
    var list = outbox().filter(function (x) { return x.payload.requestId !== item.payload.requestId; });
    list.push(item);
    store('minue.bandeja', list);
  }

  function outboxRemove(requestId) {
    store('minue.bandeja', outbox().filter(function (x) { return x.payload.requestId !== requestId; }));
    renderOutbox();
  }

  /** Escritura: el requestId viaja siempre igual; reintentar nunca duplica. */
  function write(action, payload, label) {
    payload.requestId = payload.requestId || uuid();
    outboxPut({ action: action, payload: payload, label: label, ts: Date.now() });
    return call(action, payload).then(function (data) {
      outboxRemove(payload.requestId);
      cacheClear();
      boot().catch(function () { /* cada pantalla reintenta sola */ });
      return data;
    }, function (error) {
      if (RETRYABLE.indexOf(error.code) === -1) outboxRemove(payload.requestId);
      else renderOutbox();
      throw error;
    });
  }

  /** Al volver la señal reintenta solo, una por una y con el mismo requestId: no duplica. */
  var flushing = false;
  function flushOutbox() {
    var pending = outbox();
    if (flushing || !pending.length) return;
    flushing = true;
    var saved = 0;
    pending.reduce(function (chain, item) {
      return chain.then(function () {
        return call(item.action, item.payload).then(function () {
          outboxRemove(item.payload.requestId);
          var draft = load('minue.borrador', null);
          if (draft && draft.requestId === item.payload.requestId) store('minue.borrador', undefined);
          saved++;
        }, function (error) {
          if (RETRYABLE.indexOf(error.code) === -1) outboxRemove(item.payload.requestId);
        });
      });
    }, Promise.resolve()).then(function () {
      flushing = false;
      renderOutbox();
      if (saved) { cacheClear(); toast(saved === 1 ? 'Se guardó lo que estaba pendiente.' : 'Se guardaron ' + saved + ' cosas pendientes.'); refresh(); }
    });
  }

  function renderOutbox() {
    var box = document.getElementById('outbox');
    var list = outbox();
    clear(box);
    if (!list.length) { box.hidden = true; return; }
    box.hidden = false;
    list.forEach(function (item) {
      var retry = el('button', { class: 'btn primary', type: 'button', text: 'Reintentar' });
      var discard = el('button', { class: 'btn ghost', type: 'button', text: 'Descartar' });
      retry.addEventListener('click', function () {
        setBusy(retry, 'Enviando…');
        call(item.action, item.payload).then(function () {
          outboxRemove(item.payload.requestId);
          var draft = load('minue.borrador', null);
          if (draft && draft.requestId === item.payload.requestId) store('minue.borrador', undefined);
          if (!sheet.hidden) closeSheet(true);
          toast('Listo, quedó guardado.');
          refresh();
        }, function (error) {
          unsetBusy(retry);
          if (RETRYABLE.indexOf(error.code) === -1) {
            outboxRemove(item.payload.requestId);
            toast(error.message || 'No se pudo guardar.', { error: true });
          } else {
            toast('Todavía no hay conexión. Probá en un rato.', { error: true });
          }
        });
      });
      discard.addEventListener('click', function () {
        confirmSheet('¿Descartar esta operación?',
          'Si ya se había guardado, no cambia nada. Si no, se pierde y tendrás que cargarla de nuevo.',
          'Sí, descartar', function () { outboxRemove(item.payload.requestId); });
      });
      box.appendChild(el('div', { class: 'card' }, [
        el('strong', { text: 'Falta confirmar: ' + item.label }),
        el('p', { class: 'small', text: 'No pudimos confirmar que se guardó. Tocá Reintentar: no se duplica.' }),
        retry, discard
      ]));
    });
  }

  /* ================================================================ */
  /* Interfaz común                                                    */
  /* ================================================================ */

  function setBusy(button, text) {
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    button.dataset.label = button.dataset.label || button.textContent;
    clear(button);
    button.appendChild(el('span', { class: 'spinner', 'aria-hidden': 'true' }));
    button.appendChild(document.createTextNode(text || 'Guardando…'));
  }

  function unsetBusy(button) {
    button.disabled = false;
    button.removeAttribute('aria-busy');
    clear(button);
    button.appendChild(document.createTextNode(button.dataset.label || ''));
  }

  var toastTimer = null;
  function toast(message, options) {
    options = options || {};
    if (options.error) buzz([30, 40, 30]); else buzz(12);
    var box = document.getElementById('toast');
    clear(box);
    box.className = 'toast' + (options.error ? ' error' : '');
    box.appendChild(el('span', { text: message }));
    if (options.action) {
      box.appendChild(el('button', { type: 'button', text: options.action.label, onclick: function () {
        box.hidden = true;
        options.action.run();
      } }));
    }
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.hidden = true; }, options.ms || (options.action ? 9000 : 4000));
  }

  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('sheet-backdrop');
  var lastFocus = null;

  function openSheet(content, label) {
    lastFocus = document.activeElement;
    clear(sheet);
    sheet.setAttribute('aria-label', label || 'Detalle');
    sheet.appendChild(el('div', { class: 'sheet-inner' }, content));
    sheet.hidden = false;
    backdrop.hidden = false;
    var first = sheet.querySelector('button, input, a, select, textarea');
    if (first) setTimeout(function () { first.focus(); }, 30);
  }

  function closeSheet(force) {
    if (force !== true && sheet.querySelector('[aria-busy="true"]')) return;
    sheet.hidden = true;
    backdrop.hidden = true;
    clear(sheet);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  backdrop.addEventListener('click', function () { closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  function confirmSheet(title, text, yes, onYes) {
    var ok = el('button', { class: 'btn primary', type: 'button', text: yes });
    ok.addEventListener('click', function () { closeSheet(); onYes(); });
    openSheet([el('h2', { text: title }), el('p', { text: text }),
      el('div', { class: 'stack' }, [ok, el('button', { class: 'btn secondary', type: 'button', text: 'Volver', onclick: closeSheet })])], title);
  }

  function loading() {
    if (S.leave) { S.leave(); S.leave = null; }
    if (!sheet.hidden) closeSheet(true);
    clear(main);
    main.appendChild(el('div', { 'aria-label': 'Cargando', role: 'status' }, [
      el('div', { class: 'skeleton' }), el('div', { class: 'skeleton' }), el('div', { class: 'skeleton' })
    ]));
  }

  function showError(error, retry) {
    clear(main);
    var msg = error && error.code === 'NETWORK' ?
      'No pudimos conectarnos. Revisá la señal o el wifi.' : (error && error.message) || 'Algo salió mal.';
    main.appendChild(el('div', { class: 'card empty' }, [
      el('strong', { text: 'No se pudo cargar' }),
      el('p', { text: msg }),
      el('button', { class: 'btn primary', type: 'button', text: 'Probar de nuevo', onclick: retry })
    ]));
  }

  /* ---- Caché local: lo último que se vio aparece al instante y se actualiza por detrás ---- */
  var CACHE_KEY = 'minue.cache.v2';
  var FRESH_MS = 20000;
  var BOOT_KEYS = { inicio: 1, recorrido: 1, pendientesCobro: 1, pedidos: 1, clientes: 1 };
  var memo = (function () {
    var m = load(CACHE_KEY, null);
    if (!m || m.user !== USER || m.day !== todayKey() || !m.items) m = { user: USER, day: todayKey(), items: {} };
    return m;
  })();
  var persistTimer = null;

  function persistCache() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function () { store(CACHE_KEY, memo); }, 300);
  }

  function cacheKey(action, payload) { return action + '|' + JSON.stringify(payload || {}); }

  /** Para la pantalla Hoy se combinan Inicio y Recorrido, que llegan juntos en el arranque. */
  function peek(action, payload) {
    if (action === 'hoy') {
      var a = cacheGet(cacheKey('inicio'));
      var b = cacheGet(cacheKey('recorrido'));
      return a && b ? { t: Math.min(a.t, b.t), data: { inicio: a.data, recorrido: b.data } } : null;
    }
    return cacheGet(cacheKey(action, payload));
  }

  function cacheGet(key) {
    if (memo.day !== todayKey()) { memo = { user: USER, day: todayKey(), items: {} }; return null; }
    return memo.items[key] || null;
  }

  function cachePut(key, data) {
    memo.items[key] = { t: Date.now(), data: data };
    var keys = Object.keys(memo.items);
    if (keys.length > 40) {
      keys.sort(function (a, b) { return memo.items[a].t - memo.items[b].t; });
      keys.slice(0, keys.length - 40).forEach(function (k) { delete memo.items[k]; });
    }
    persistCache();
  }

  /** Después de escribir, lo guardado ya no sirve: se borra para no mostrar saldos viejos. */
  function cacheClear() { memo.items = {}; persistCache(); }

  /** Al tocar Actualizar: se sigue mostrando lo que hay y se vuelve a pedir. */
  function cacheStale() {
    Object.keys(memo.items).forEach(function (k) { memo.items[k].t = 0; });
    persistCache();
  }

  function setSyncing(on) {
    var node = document.getElementById('sync');
    if (node) node.hidden = !on;
  }

  /** Una sola llamada trae Inicio, Recorrido, Cobros, Pedidos y Clientes. */
  function boot() {
    if (S.booting) return S.booting;
    setSyncing(true);
    S.booting = call('bootstrap', {}).then(function (b) {
      cachePut(cacheKey('inicio'), b.inicio);
      cachePut(cacheKey('recorrido'), b.recorrido);
      cachePut(cacheKey('pendientesCobro'), b.pendientesCobro);
      cachePut(cacheKey('pedidos'), b.pedidos);
      cachePut(cacheKey('clientes'), b.clientes);
      S.booting = null;
      setSyncing(false);
      if (S.softRefresh && S.current === renderHoy) {
        S.softRefresh = false;
        var y = window.scrollY;
        renderHoy();
        window.scrollTo(0, y);
      }
      if (!S.prefetched) { S.prefetched = true; setTimeout(prefetchCatalog, 800); }
    }, function (error) {
      S.booting = null;
      setSyncing(false);
      throw error;
    });
    return S.booting;
  }

  /** Deja listo el catálogo para que Nuevo pedido abra sin espera. */
  function prefetchCatalog() {
    if (S.catalog && Date.now() - S.catalogT < 300000) return;
    call('catalogo', {}).then(function (c) { S.catalog = c; S.catalogT = Date.now(); }, function () { /* se pedirá al abrir */ });
  }

  function fetchData(action, payload) {
    var key = cacheKey(action, payload);
    if (action === 'hoy') {
      return boot().then(function () {
        return { inicio: cacheGet(cacheKey('inicio')).data, recorrido: cacheGet(cacheKey('recorrido')).data };
      });
    }
    if (BOOT_KEYS[action] && (!payload || !Object.keys(payload).length)) {
      return boot().then(function () {
        var c = cacheGet(key);
        return c ? c.data : call(action, payload);
      });
    }
    return call(action, payload).then(function (data) { cachePut(key, data); return data; });
  }

  /** Muestra al instante lo último que se vio y lo actualiza por detrás; ignora respuestas de pantallas que ya se cerraron. */
  function screen(action, payload, render) {
    var id = ++S.renderId;
    var cached = peek(action, payload);
    var drawn = null;

    function draw(data, keepScroll) {
      var y = keepScroll ? window.scrollY : 0;
      main.classList.toggle('no-anim', !!keepScroll);
      if (S.leave) { S.leave(); S.leave = null; }
      clear(main);
      render(data);
      drawn = JSON.stringify(data);
      if (keepScroll) window.scrollTo(0, y);
      else main.focus({ preventScroll: true });
    }

    var run = function () {
      if (cached) {
        draw(cached.data, false);
        if (Date.now() - cached.t < FRESH_MS) return;
      } else {
        loading();
      }
      setSyncing(true);
      fetchData(action, payload).then(function (data) {
        if (id !== S.renderId) return;
        setSyncing(false);
        if (drawn === null || JSON.stringify(data) !== drawn) draw(data, drawn !== null);
      }, function (error) {
        if (id !== S.renderId) return;
        setSyncing(false);
        if (drawn !== null) { toast('Sin conexión. Te muestro lo último que había.', { error: true }); return; }
        showError(error, run);
      });
    };
    run();
  }

  function setFab(show) {
    var f = document.getElementById('fab');
    if (f) f.hidden = !show;
    main.classList.toggle('with-fab', !!show);
  }

  function go(tab) {
    if (tab === 'recorrido') tab = 'inicio';
    if (!sheet.hidden) closeSheet(true);
    S.tab = tab;
    document.querySelectorAll('.tab').forEach(function (t) {
      if (t.getAttribute('data-tab') === tab) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    setFab(true);
    ({ inicio: renderHoy, recorrido: renderHoy, pedidos: renderPedidos, clientes: renderClientes, cobros: renderCobros }[tab])();
  }

  function refresh() {
    cacheStale();
    if (S.current) S.current();
    else go(S.tab);
  }

  function linkBtn(href, text, cls, iconName) {
    var a = el('a', { class: 'btn ' + (cls || 'secondary'), href: href, target: '_blank', rel: 'noopener' },
      [iconName ? icon(iconName) : null, text]);
    return a;
  }

  function btn(text, cls, onClick, iconName) {
    return el('button', { class: 'btn ' + (cls || 'secondary'), type: 'button', onclick: onClick }, [iconName ? icon(iconName) : null, text]);
  }

  function priorityBadge(p) {
    if (p === 'CRÍTICA' || p === 'CRITICA') return el('span', { class: 'badge crit', text: 'Crítica' });
    if (p === 'URGENTE') return el('span', { class: 'badge urgent', text: 'Urgente' });
    return null;
  }

  /** "2 cajas", "1 bulto", "12 unidades". */
  function qtyText(n, presentation) {
    var p = String(presentation || '').toLowerCase();
    if (n === 1) return '1 ' + p;
    return n + ' ' + (p === 'unidad' ? 'unidades' : p + 's');
  }

  /** Vibración corta al confirmar; se apaga con "reducir movimiento" y no se repite seguida. */
  var lastBuzz = 0;
  function buzz(pattern) {
    try {
      if (!navigator.vibrate || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
      var now = Date.now();
      if (!Array.isArray(pattern) && now - lastBuzz < 1500) return;
      lastBuzz = now;
      navigator.vibrate(pattern);
    } catch (e) { /* sin vibración */ }
  }

  /** Marca de éxito que se dibuja sola: el cierre de una acción importante. */
  function checkMark() {
    var box = el('div', { class: 'success-mark', 'aria-hidden': 'true' });
    box.innerHTML = '<svg viewBox="0 0 24 24"><circle class="check-circle" cx="12" cy="12" r="10"/><path class="check-tick" d="M7.5 12.5l3 3 6-6.5"/></svg>';
    return box;
  }

  /** Enlace de WhatsApp con el texto ya escrito; sin número, WhatsApp deja elegir a quién enviarlo. */
  function waLink(base, text) {
    var root = /^https:\/\/wa\.me\/\d+$/.test(String(base || '')) ? base : 'https://wa.me/';
    return root + '?text=' + encodeURIComponent(text);
  }

  function comprobanteTexto(cliente, importe, saldo) {
    var fecha = S.hoy && S.hoy.inicio ? capital(S.hoy.inicio.hoyTexto) : 'Hoy';
    return 'Hola, te confirmo el cobro de ' + money(importe) + ' (' + fecha + ' · ' + cliente + '). ' +
      (saldo > 0 ? 'Todavía queda un saldo de ' + money(saldo) + '. ' : 'El pedido quedó pagado. ') + 'Gracias. MINUÉ Distribución';
  }

  /** Grupo de opciones para elegir una sola. */
  function chipRow(options, current, onPick, aria) {
    var group = el('div', { class: 'chips', role: 'group', 'aria-label': aria });
    options.forEach(function (o) {
      group.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(current === o[0]), text: o[1], onclick: function () { onPick(o[0]); } }));
    });
    return group;
  }

  function hours(o) {
    if (o.desde && o.hasta) return o.desde + ' a ' + o.hasta;
    return o.desde || o.hasta || 'Sin horario';
  }

  /* ================================================================ */
  /* HOY · la parada que sigue y qué hacer con ella                     */
  /* ================================================================ */

  /** "Ya salí hacia esta parada": se recuerda en el teléfono, solo por hoy. */
  function enrutaGet(orderId) {
    var e = load('minue.enruta', null);
    return !!(e && e.day === todayKey() && e.orderId === orderId);
  }

  function enrutaSet(orderId) {
    store('minue.enruta', orderId ? { day: todayKey(), orderId: orderId } : undefined);
  }

  function renderHoy() {
    S.current = renderHoy;
    screen('hoy', {}, drawHoy);
  }

  function pill(label, value, cls) {
    return el('div', { class: 'pill' + (cls ? ' ' + cls : '') }, [el('span', { text: label }), el('b', { text: value })]);
  }

  function drawHoy(h) {
    S.hoy = h;
    var d = h.inicio;
    var r = h.recorrido;
    var done = r.entregadasHoy;
    var total = r.restantes + r.ocultas + done;

    main.appendChild(el('p', { class: 'welcome', text: 'Bienvenido' + (d.user ? ' ' + capital(d.user) : '') }));
    main.appendChild(el('p', { class: 'greet', text: capital(d.hoyTexto) }));
    main.appendChild(el('h1', { text: total ? 'Hoy llevás ' + done + ' de ' + total : 'Hoy no tenés entregas' }));
    if (total) {
      main.appendChild(el('div', { class: 'bar', role: 'progressbar', 'aria-label': 'Entregas de hoy',
        'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(done) },
        [el('i', { style: 'width:' + Math.round(done / total * 100) + '%' })]));
    }
    if (d.atrasadas > 0) main.appendChild(el('p', { class: 'late-line', text: d.atrasadas + (d.atrasadas === 1 ? ' entrega atrasada' : ' entregas atrasadas') }));
    main.appendChild(el('div', { class: 'pills' }, [pill('Cobrado hoy', money(d.cobradoHoy)), pill('Te deben en la ruta', money(r.aCobrar))]));

    if (!r.stops.length) {
      main.appendChild(el('div', { class: 'card empty' }, [
        done ? checkMark() : null,
        el('strong', { text: done ? 'Listo por hoy' : 'No hay entregas pendientes' }),
        el('span', { text: done ? 'Entregaste ' + done + ' y cobraste ' + money(d.cobradoHoy) + '.' : 'Cuando cargues un pedido para hoy, aparece acá.' })
      ]));
      if (done) {
        main.appendChild(el('div', { class: 'stack', style: 'margin-top:12px' }, [
          btn('Ver el cierre del día', 'primary', function () { go('cobros'); }, 'cash'),
          linkBtn(r.volverBaseUrl, 'Volver a la base', 'secondary', 'home')
        ]));
      }
      return;
    }

    var heroWrap = el('div');
    main.appendChild(heroWrap);
    function paintHero() {
      clear(heroWrap);
      heroWrap.appendChild(heroCard(r.stops[0], r, paintHero));
    }
    paintHero();

    if (r.stops.length > 1) {
      main.appendChild(el('h2', { text: 'Después' }));
      r.stops.slice(1).forEach(function (s, i) {
        var row = afterRow(s);
        row.style.setProperty('--i', String(Math.min(i, 5)));
        main.appendChild(row);
      });
    }
    if (r.ocultas) main.appendChild(el('p', { class: 'small', text: 'Hay ' + r.ocultas + ' paradas más. Aparecen cuando completes estas.' }));

    main.appendChild(el('h2', { text: 'Al terminar' }));
    main.appendChild(el('div', { class: 'stack' }, [
      linkBtn(r.volverBaseUrl, 'Volver a la base', 'secondary', 'home'),
      linkBtn(r.recorridoCompletoUrl, 'Ver todo el recorrido en Maps', 'ghost', 'route'),
      el('p', { class: 'small', text: r.explicacion + (r.modo !== 'aproximado' ? ' Algunas direcciones no se ubicaron en el mapa: van al final.' : '') }),
      el('p', { class: 'small', text: 'En el celular, Maps puede mostrar pocas paradas juntas. Lo más seguro es ir con Maps parada por parada.' })
    ]));
  }

  /** Tarjeta de la siguiente parada: un solo botón principal que cambia según el estado. */
  function heroCard(s, r, repaint) {
    var enroute = enrutaGet(s.orderId);
    var card = el('article', { class: 'hero', 'aria-label': 'Siguiente parada: ' + s.cliente });
    card.appendChild(el('div', { class: 'hero-top' }, [
      el('span', { class: 'hero-kicker', text: 'Siguiente · parada 1 de ' + (r.restantes + r.ocultas) }),
      s.atrasado ? el('span', { class: 'hchip late', text: 'Atrasada · ' + dayLabel(s.fecha) }) : null,
      s.prioridad && s.prioridad !== 'NORMAL' ? el('span', { class: 'hchip', text: nice(s.prioridad) }) : null
    ]));
    card.appendChild(el('h2', { class: 'hero-name', text: s.cliente }));
    card.appendChild(el('p', { class: 'hero-addr', text: s.direccion + ' · ' + nice(s.localidad) }));
    card.appendChild(el('dl', { class: 'hero-info' }, [
      el('dt', { text: 'Horario' }), el('dd', { text: hours(s) }),
      el('dt', { text: 'Cobrar' }), el('dd', { class: 'money', text: s.saldo > 0 ? money(s.saldo) : 'Ya pagó' }),
      s.recibe ? el('dt', { text: 'Recibe' }) : null, s.recibe ? el('dd', { text: s.recibe }) : null
    ]));
    var notes = [s.instrucciones, s.observaciones && s.observaciones !== 'NADA' ? s.observaciones : ''].filter(Boolean).join(' · ');
    if (notes) card.appendChild(el('div', { class: 'note', text: notes }));
    if (s.aviso) card.appendChild(el('div', { class: 'note', text: s.aviso }));
    if (s.sinUbicacion) card.appendChild(el('div', { class: 'note', text: 'No pudimos ubicar esta dirección en el mapa. Revisala en Maps.' }));

    if (!enroute) {
      card.appendChild(el('a', { class: 'btn hero-primary', href: s.mapsUrl, target: '_blank', rel: 'noopener', onclick: function () {
        enrutaSet(s.orderId);
        setTimeout(repaint, 400);
      } }, [icon('map'), 'Ir con Maps']));
      card.appendChild(btn('Ya estoy acá', 'hero-sec', function () { openEntrega(s); }, 'check'));
    } else {
      card.appendChild(el('button', { class: 'btn hero-primary', type: 'button', onclick: function () { openEntrega(s); } }, [icon('check'), 'Entregué']));
      card.appendChild(linkBtn(s.mapsUrl, 'Abrir Maps de nuevo', 'hero-sec', 'map'));
    }
    var tiles = [];
    if (s.telefono) tiles.push(linkBtn('tel:' + s.telefono, 'Llamar', 'hero-sec tile', 'phone'));
    if (s.whatsapp) tiles.push(linkBtn(s.whatsapp, 'Avisar', 'hero-sec tile', 'chat'));
    tiles.push(btn('No pude entregar', 'hero-sec tile', function () { openNoEntrega(s); }, 'back'));
    card.appendChild(el('div', { class: 'hero-tiles' }, tiles));
    return card;
  }

  /** Paradas siguientes: compactas; se abren para ir primero, entregar o llamar. */
  function afterRow(s) {
    var head = el('button', { class: 'after-head', type: 'button', 'aria-expanded': 'false' }, [
      el('div', {}, [
        el('strong', { text: s.cliente }),
        el('div', { class: 'small', text: s.direccion + ' · ' + nice(s.localidad) }),
        s.atrasado ? el('div', { class: 'small late-text', text: 'Atrasada · ' + dayLabel(s.fecha) }) : null
      ]),
      el('span', { class: s.saldo > 0 ? 'owe' : 'paid', text: s.saldo > 0 ? money(s.saldo) : 'Pagado' })
    ]);
    var body = el('div', { class: 'after-body', hidden: true });
    var first = btn(s.elegida ? 'Quitar "ir primero"' : 'Ir primero a esta parada', 'secondary', function (e) {
      priorizar(s.elegida ? '' : s.orderId, e.currentTarget, s.cliente);
    }, 'star');
    body.appendChild(first);
    body.appendChild(el('div', { class: 'btn-row' }, [
      linkBtn(s.mapsUrl, 'Ir con Maps', 'secondary', 'map'),
      btn('Entregué', 'secondary strong', function () { openEntrega(s); }, 'check')
    ]));
    var contact = [];
    if (s.telefono) contact.push(linkBtn('tel:' + s.telefono, 'Llamar', 'ghost', 'phone'));
    if (s.whatsapp) contact.push(linkBtn(s.whatsapp, 'Avisar', 'ghost', 'chat'));
    if (contact.length) body.appendChild(el('div', { class: 'btn-row' }, contact));
    body.appendChild(btn('No pude entregar', 'ghost', function () { openNoEntrega(s); }));
    head.addEventListener('click', function () {
      var open = body.hidden;
      body.hidden = !open;
      head.setAttribute('aria-expanded', String(open));
    });
    return el('div', { class: 'after' }, [head, body]);
  }

  function priorizar(orderId, button, name) {
    setBusy(button, 'Reordenando…');
    write('priorizar', { orderId: orderId }, orderId ? 'Ir primero a ' + name : 'Quitar prioridad').then(function (res) {
      if (res.recorrido) cachePut(cacheKey('recorrido'), res.recorrido);
      if (S.current !== renderHoy) return;
      if (res.recorrido && S.hoy) { drawHoyFresh({ inicio: S.hoy.inicio, recorrido: res.recorrido }); window.scrollTo(0, 0); }
      else refresh();
      toast(orderId ? 'Listo: primero vas a ' + name + '. Reordené el resto.' : 'Volvimos al orden automático.');
    }, function (error) {
      unsetBusy(button);
      toast(error.message || 'No se pudo reordenar.', { error: true });
    });
  }

  function drawHoyFresh(h) {
    if (S.leave) { S.leave(); S.leave = null; }
    main.classList.add('no-anim');
    clear(main);
    drawHoy(h);
  }

  /** Hoja única para entregar y, si corresponde, cobrar: lo habitual ya viene elegido. */
  function openEntrega(s) {
    var st = { modo: s.saldo > 0 ? 'todo' : 'ninguno', medio: 'EFECTIVO', importe: '', requestId: null };
    var confirmBtn = null;

    function amount() {
      if (st.modo === 'todo') return s.saldo;
      if (st.modo === 'parte') return parseMoney(st.importe);
      return 0;
    }

    function label() {
      if (s.saldo <= 0) return 'Entregué';
      if (st.modo === 'no') return 'Entregué, sin cobrar';
      var a = amount();
      return 'Entregué y cobré' + (a ? ' ' + money(a) : '');
    }

    function chipGroup(options, current, onPick, aria) {
      var group = el('div', { class: 'chips', role: 'group', 'aria-label': aria });
      options.forEach(function (o) {
        group.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(current === o[0]), text: o[1], onclick: function () { onPick(o[0]); } }));
      });
      return group;
    }

    function draw() {
      var err = el('div', { class: 'error-box', hidden: true });
      var content = [el('h2', { text: 'Entregar a ' + s.cliente })];
      if (s.saldo <= 0) {
        content.push(el('p', { text: 'Este pedido ya está pagado.' }));
      } else {
        content.push(el('p', { style: 'margin:0', text: '¿Te pagó?' }), el('div', { class: 'big-amount', text: money(s.saldo) }));
        content.push(el('div', { style: 'margin-top:10px' }, [chipGroup([['todo', 'Todo'], ['parte', 'Una parte'], ['no', 'No pagó']], st.modo,
          function (v) { st.modo = v; draw(); }, '¿Cuánto pagó?')]));
        if (st.modo === 'parte') {
          var input = el('input', { class: 'input', id: 'ent-importe', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Ej: 20000', value: st.importe, 'aria-label': 'Importe que pagó' });
          input.addEventListener('input', function () {
            st.importe = input.value;
            if (confirmBtn && !confirmBtn.disabled) confirmBtn.textContent = label();
          });
          content.push(el('label', { class: 'field', for: 'ent-importe' }, [el('span', { text: '¿Cuánto te pagó?' }), input]));
        }
        if (st.modo !== 'no') {
          content.push(el('div', { style: 'margin-top:12px' }, [chipGroup(MEDIOS.map(function (m) { return [m[0], m[1]]; }), st.medio,
            function (v) { st.medio = v; draw(); }, '¿Cómo te pagó?')]));
        }
      }
      confirmBtn = btn(label(), 'primary', function () {
        var a = amount();
        if (st.modo === 'parte' && (a === null || a <= 0)) { err.textContent = 'Escribí cuánto te pagó. Ejemplo: 20000'; err.hidden = false; return; }
        if (a > s.saldo + 0.01) { err.textContent = 'Es más de lo que debe (' + money(s.saldo) + ').'; err.hidden = false; return; }
        st.requestId = st.requestId || uuid();
        setBusy(confirmBtn, 'Guardando…');
        var payload = { requestId: st.requestId, orderId: s.orderId };
        if (a > 0) { payload.importe = a; payload.medio = st.medio; }
        write('entregarYCobrar', payload, 'Entrega' + (a > 0 ? ' y cobro de ' + money(a) : '') + ' a ' + s.cliente).then(function (res) {
          closeSheet(true);
          afterEntrega(s, res, a || 0);
        }, function (error) {
          unsetBusy(confirmBtn);
          err.textContent = error.code === 'NETWORK' ?
            'No pudimos confirmar que se guardó. No lo cargues de nuevo: quedó en el teléfono. Tocá Reintentar arriba cuando tengas señal.' :
            (error.message || 'No se pudo guardar.');
          err.hidden = false;
        });
      });
      content.push(err, el('div', { class: 'stack', style: 'margin-top:16px' }, [confirmBtn, btn('Cancelar', 'secondary', closeSheet)]));
      openSheet(content, 'Entregar a ' + s.cliente);
    }

    draw();
  }

  var MOTIVOS = ['Estaba cerrado', 'No había nadie', 'No quiso recibir', 'Faltó mercadería', 'Otro motivo'];

  /** "No pude entregar": se elige qué pasó y cuándo volver a pasar; el pedido no se pierde. */
  function openNoEntrega(s) {
    var st = { motivo: '', dia: 'manana', fecha: '', requestId: null };
    draw();

    function draw() {
      var err = el('div', { class: 'error-box', hidden: true });
      var content = [el('h2', { text: '¿Qué pasó en ' + s.cliente + '?' })];
      content.push(chipRow(MOTIVOS.map(function (m) { return [m, m]; }), st.motivo, function (v) { st.motivo = v; draw(); }, 'Qué pasó'));
      content.push(el('p', { style: 'margin:16px 0 6px;font-weight:700', text: 'Volver a pasar' }));
      content.push(chipRow([['manana', 'Mañana'], ['otro', 'Otro día']], st.dia, function (v) { st.dia = v; draw(); }, 'Cuándo volver a pasar'));
      if (st.dia === 'otro') {
        var date = el('input', { class: 'input', type: 'date', min: todayKey(1), value: st.fecha, 'aria-label': 'Día para volver a pasar' });
        date.addEventListener('change', function () { st.fecha = date.value; });
        content.push(el('div', { style: 'margin-top:10px' }, [date]));
      }
      content.push(el('p', { class: 'small', text: 'El pedido sigue pendiente y vuelve a tu recorrido ese día.' }));
      var confirm = btn(st.dia === 'manana' ? 'Reprogramar para mañana' : 'Reprogramar', 'primary', function () {
        if (!st.motivo) { err.textContent = 'Elegí qué pasó.'; err.hidden = false; return; }
        if (st.dia === 'otro' && !st.fecha) { err.textContent = 'Elegí el día para volver a pasar.'; err.hidden = false; return; }
        st.requestId = st.requestId || uuid();
        setBusy(confirm, 'Guardando…');
        write('noEntregado', { requestId: st.requestId, orderId: s.orderId, motivo: st.motivo, fecha: st.dia === 'otro' ? st.fecha : '' },
          'Reprogramar a ' + s.cliente).then(function (res) {
          closeSheet(true);
          afterNoEntrega(s, res);
        }, function (error) {
          unsetBusy(confirm);
          err.textContent = error.code === 'NETWORK' ?
            'No pudimos confirmar que se guardó. Quedó en el teléfono: tocá Reintentar arriba cuando tengas señal.' : (error.message || 'No se pudo guardar.');
          err.hidden = false;
        });
      });
      content.push(err, el('div', { class: 'stack', style: 'margin-top:16px' }, [confirm, btn('Cancelar', 'secondary', closeSheet)]));
      openSheet(content, 'No pude entregar a ' + s.cliente);
    }
  }

  function afterNoEntrega(s, res) {
    enrutaSet('');
    if (res.recorrido) cachePut(cacheKey('recorrido'), res.recorrido);
    if (S.current === renderHoy && S.hoy && res.recorrido) {
      S.softRefresh = true;
      drawHoyFresh({ inicio: S.hoy.inicio, recorrido: res.recorrido });
      window.scrollTo(0, 0);
    } else {
      refresh();
    }
    toast(s.cliente + ' pasa para ' + dayLabel(res.nuevaFecha).toLowerCase() + '. Anotamos el motivo.');
  }

  /** Después de guardar: la pantalla se actualiza con la respuesta y se confirma con los datos reales por detrás. */
  function afterEntrega(s, res, paid) {
    enrutaSet('');
    if (res.recorrido) cachePut(cacheKey('recorrido'), res.recorrido);
    if (S.current === renderHoy && S.hoy && res.recorrido) {
      var inicio = JSON.parse(JSON.stringify(S.hoy.inicio));
      inicio.cobradoHoy = Math.round((inicio.cobradoHoy + paid) * 100) / 100;
      cachePut(cacheKey('inicio'), inicio);
      S.softRefresh = true;
      drawHoyFresh({ inicio: inicio, recorrido: res.recorrido });
      window.scrollTo(0, 0);
    } else {
      refresh();
    }
    var opts = {};
    if (paid <= 0 && !res.yaEstaba) {
      opts.action = { label: 'Deshacer', run: function () {
        write('deshacerEntrega', { orderId: s.orderId }, 'Deshacer entrega a ' + s.cliente).then(function () {
          toast('Listo, la entrega volvió a pendiente.');
          refresh();
        }, function (error) { toast(error.message || 'No se pudo deshacer.', { error: true }); });
      } };
    }
    if (paid > 0 && s.whatsapp) {
      opts.action = { label: 'Enviar comprobante', run: function () {
        window.open(waLink(s.whatsapp, comprobanteTexto(s.cliente, paid, res.cobro ? res.cobro.saldo : 0)), '_blank', 'noopener');
      } };
    }
    toast('Entregado a ' + s.cliente + (paid > 0 ? ' · cobraste ' + money(paid) : ''), opts);
  }

  /* ================================================================ */
  /* COBRAR (hoja con confirmación)                                    */
  /* ================================================================ */

  var MEDIOS = [['EFECTIVO', 'Efectivo'], ['TRANSFERENCIA', 'Transferencia'], ['MERCADO PAGO', 'Mercado Pago'], ['OTRO', 'Otro']];

  function openCobro(o, onDone) {
    var state = { importe: String(o.saldo).replace('.', ','), medio: 'EFECTIVO', requestId: null };
    stepAmount();

    function stepAmount() {
      var input = el('input', { class: 'input', id: 'cobro-importe', inputmode: 'decimal', autocomplete: 'off', value: state.importe, 'aria-label': 'Importe cobrado' });
      var error = el('div', { class: 'error-box', hidden: true });
      var medios = el('div', { class: 'chips', role: 'group', 'aria-label': 'Cómo te pagó' });
      MEDIOS.forEach(function (m) {
        medios.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(state.medio === m[0]), text: m[1], onclick: function () {
          state.medio = m[0];
          medios.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.textContent === m[1])); });
        } }));
      });
      var next = btn('Continuar', 'primary', function () {
        state.importe = input.value;
        var amount = parseMoney(input.value);
        if (amount === null || amount <= 0) return showErr('Escribí cuánto te pagó. Ejemplo: 15000');
        if (amount > o.saldo + 0.01) return showErr('Es más de lo que debe (' + money(o.saldo) + ').');
        state.amount = amount;
        state.requestId = state.requestId || uuid();
        stepConfirm();
      });
      function showErr(text) { error.textContent = text; error.hidden = false; input.focus(); }
      openSheet([
        el('h2', { text: 'Cobrar a ' + o.cliente }),
        el('p', { style: 'margin:0', text: 'Debe' }),
        el('div', { class: 'big-amount', text: money(o.saldo) }),
        el('label', { class: 'field', for: 'cobro-importe' }, [el('span', { text: '¿Cuánto te pagó?' }), input]),
        el('div', { class: 'chips', style: 'margin-top:8px' }, [
          el('button', { class: 'chip', type: 'button', text: 'Todo (' + money(o.saldo) + ')', onclick: function () { input.value = String(o.saldo).replace('.', ','); } })
        ]),
        el('div', { class: 'field' }, [el('span', { style: 'display:block;font-weight:700;margin:14px 0 6px', text: '¿Cómo te pagó?' }), medios]),
        error,
        el('div', { class: 'stack', style: 'margin-top:16px' }, [next, btn('Cancelar', 'secondary', closeSheet)])
      ], 'Cobrar a ' + o.cliente);
    }

    function stepConfirm(duplicateWarning) {
      var medioText = MEDIOS.filter(function (m) { return m[0] === state.medio; })[0][1];
      var remaining = Math.round((o.saldo - state.amount) * 100) / 100;
      var errorBox = el('div', { class: 'error-box', hidden: !duplicateWarning, text: duplicateWarning || '' });
      var confirm = btn(duplicateWarning ? 'Sí, es otro pago' : 'Sí, registrar el cobro', 'primary', function () {
        setBusy(confirm, 'Guardando…');
        var payload = { orderId: o.orderId, importe: state.amount, medio: state.medio, requestId: state.requestId,
          confirmarDuplicado: !!duplicateWarning };
        write('cobrar', payload, 'Cobro de ' + money(state.amount) + ' a ' + o.cliente).then(function (res) {
          unsetBusy(confirm);
          stepDone(res);
        }, function (error) {
          unsetBusy(confirm);
          if (error.code === 'POSIBLE_DUPLICADO') return stepConfirm(error.message);
          if (error.code === 'NETWORK') {
            errorBox.textContent = 'No pudimos confirmar que se guardó. No lo cargues de nuevo: quedó en el teléfono. Tocá Reintentar arriba cuando tengas señal.';
          } else {
            errorBox.textContent = error.message || 'No se pudo guardar.';
          }
          errorBox.hidden = false;
        });
      });
      openSheet([
        el('h2', { text: duplicateWarning ? 'Atención' : '¿Confirmás el cobro?' }),
        el('div', { class: 'summary' }, [
          row('Cliente', o.cliente), row('Recibiste', money(state.amount), true), row('Cómo', medioText),
          row('Queda debiendo', remaining > 0 ? money(remaining) : 'Nada')
        ]),
        errorBox,
        el('div', { class: 'stack' }, [confirm, btn('Volver', 'secondary', function () { stepAmount(); })])
      ], 'Confirmar cobro');
    }

    function stepDone(res) {
      if (res.repetida) {
        openSheet([
          el('div', { class: 'badges' }, [el('span', { class: 'badge ok', text: 'Ya estaba guardado' })]),
          el('h2', { text: 'Este cobro ya estaba registrado' }),
          el('p', { text: 'No se duplicó. Revisá el saldo en Plata.' }),
          btn('Listo', 'primary', function () { closeSheet(); if (onDone) onDone(); })
        ], 'Cobro ya registrado');
        return;
      }
      openSheet([
        checkMark(),
        el('h2', { class: 'centered', text: res.pagado ? 'Pedido pagado por completo' : 'Cobro registrado' }),
        el('p', { class: 'centered', text: res.pagado ? o.cliente + ' ya no debe nada de este pedido.' : o.cliente + ' todavía debe ' + money(res.saldo) + '.' }),
        el('div', { class: 'stack' }, [
          o.whatsapp ? linkBtn(waLink(o.whatsapp, comprobanteTexto(o.cliente, state.amount, res.saldo)), 'Enviar comprobante por WhatsApp', 'secondary', 'chat') : null,
          btn('Listo', 'primary', function () { closeSheet(); if (onDone) onDone(); })
        ])
      ], 'Cobro registrado');
    }
  }

  function row(label, value, strong) {
    return el('div', { class: 'row' }, [el('span', { text: label }), el('span', { class: strong ? 'money' : '', text: value })]);
  }

  /* ================================================================ */
  /* PEDIDOS                                                           */
  /* ================================================================ */

  function renderPedidos() {
    S.current = renderPedidos;
    screen('pedidos', {}, function (d) {
      main.appendChild(el('h1', { text: 'Pedidos' }));
      main.appendChild(btn('Nuevo pedido', 'primary', function () { openNuevoPedido(); }, 'plus'));
      if (load('minue.borrador', null)) {
        main.appendChild(el('div', { class: 'banner', style: 'margin-top:12px' }, [
          el('span', { text: 'Tenés un pedido sin terminar. ' }),
          el('button', { class: 'btn ghost', type: 'button', text: 'Continuar', onclick: function () { openNuevoPedido(); } })
        ]));
      }
      var today = todayKey();
      var groups = [
        ['Atrasados', d.pedidos.filter(function (p) { return !p.entregado && p.fecha < today; })],
        ['Para hoy', d.pedidos.filter(function (p) { return !p.entregado && p.fecha === today; })],
        ['Próximos días', d.pedidos.filter(function (p) { return !p.entregado && p.fecha > today; })],
        ['Entregados que deben o de hoy', d.pedidos.filter(function (p) { return p.entregado; })]
      ];
      var any = false;
      groups.forEach(function (g) {
        if (!g[1].length) return;
        any = true;
        main.appendChild(el('h2', { text: g[0] + ' (' + g[1].length + ')' }));
        g[1].forEach(function (p) { main.appendChild(orderItem(p)); });
      });
      if (!any) main.appendChild(el('div', { class: 'card empty', style: 'margin-top:16px' }, [el('strong', { text: 'No hay pedidos pendientes' }), el('span', { text: 'Tocá Nuevo pedido para cargar uno.' })]));
    });
  }

  function orderItem(p) {
    return el('button', { class: 'list-item', type: 'button', onclick: function () { openPedido(p.orderId); } }, [
      el('div', { class: 'row' }, [el('strong', { text: p.cliente }), el('span', { class: 'money', text: money(p.total) })]),
      el('div', { class: 'row small' }, [
        el('span', { text: dayLabel(p.fecha) + ' · ' + hours(p) }),
        p.saldo > 0 ? el('span', { class: 'owe', text: 'Debe ' + money(p.saldo) }) : el('span', { class: 'paid', text: 'Pagado' })
      ]),
      el('div', { class: 'badges', style: 'margin:6px 0 0' }, [
        el('span', { class: 'badge' + (p.entregado ? ' ok' : ''), text: p.entregado ? 'Entregado' : nice(p.estado) }), priorityBadge(p.prioridad)
      ])
    ]);
  }

  function openPedido(orderId) {
    openSheet([el('div', { class: 'skeleton' })], 'Pedido');
    call('pedido', { orderId: orderId }).then(function (p) {
      var content = [
        el('h2', { text: p.cliente }),
        el('p', { class: 'small', style: 'margin-top:0', text: p.direccion + ' · ' + nice(p.localidad) }),
        el('div', { class: 'summary' }, [row('Entrega', dayLabel(p.fecha) + ' · ' + hours(p)), row('Estado', p.estado)].concat(
          p.lineas.map(function (l) { return row(qtyText(l.cantidad, l.presentacion) + ' · ' + l.producto, money(l.subtotal)); }),
          [row('Total', money(p.total), true), row('Pagó', money(p.pagado)), row('Debe', money(p.saldo), true)]))
      ];
      if (p.pagos.length) {
        content.push(el('p', { class: 'small', text: 'Pagos: ' + p.pagos.map(function (k) { return dayLabel(k.fecha) + ' ' + money(k.importe) + ' (' + nice(k.medio) + ')'; }).join(' · ') }));
      }
      var actions = el('div', { class: 'stack' });
      if (p.saldo > 0) actions.appendChild(btn('Cobrar', 'primary', function () { closeSheet(); openCobro(p, refresh); }, 'cash'));
      if (!p.entregado) {
        var d = btn('Marcar entregado', 'secondary strong', function () {
          closeSheet();
          openEntrega({ orderId: p.orderId, cliente: p.cliente, saldo: p.saldo, total: p.total });
        }, 'check');
        actions.appendChild(d);
      }
      actions.appendChild(linkBtn(p.mapsUrl, 'Ir con Maps', 'secondary', 'map'));
      actions.appendChild(btn('Ver cliente', 'ghost', function () { closeSheet(); go('clientes'); renderCliente(p.clientId); }));
      actions.appendChild(btn('Cerrar', 'secondary', closeSheet));
      content.push(actions);
      openSheet(content, 'Pedido de ' + p.cliente);
    }, function (error) {
      openSheet([el('h2', { text: 'No se pudo abrir el pedido' }), el('p', { text: error.message || 'Probá de nuevo.' }), btn('Cerrar', 'secondary', closeSheet)]);
    });
  }

  /* ---------------- Nuevo pedido ---------------- */

  function emptyDraft(clientId) {
    return { clientId: clientId || '', lines: {}, fecha: todayKey(), desde: '', hasta: '', prioridad: 'NORMAL', pago: 'no',
      importe: '', medio: 'EFECTIVO', recibe: '', observaciones: '', requestId: '' };
  }

  function openNuevoPedido(clientId) {
    var draft = load('minue.borrador', null);
    if (clientId && (!draft || draft.clientId !== clientId)) draft = emptyDraft(clientId);
    if (!draft) draft = emptyDraft();
    S.current = function () { openNuevoPedido(); };
    S.tab = 'pedidos';
    markTab('pedidos');
    setFab(false);
    var id = ++S.renderId;
    if (S.catalog && Date.now() - S.catalogT < 300000) {
      if (S.leave) { S.leave(); S.leave = null; }
      if (!sheet.hidden) closeSheet(true);
      drawNuevoPedido(draft);
      return;
    }
    loading();
    var run = function () {
      call('catalogo', {}).then(function (catalog) {
        if (id !== S.renderId) return;
        S.catalog = catalog;
        S.catalogT = Date.now();
        drawNuevoPedido(draft);
      }, function (error) { if (id === S.renderId) showError(error, run); });
    };
    run();
  }

  function markTab(tab) {
    document.querySelectorAll('.tab').forEach(function (t) {
      if (t.getAttribute('data-tab') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  }

  function drawNuevoPedido(draft) {
    var cat = S.catalog;
    var clientsById = {};
    cat.clientes.forEach(function (c) { clientsById[c.clientId] = c; });
    var productsById = {};
    cat.productos.forEach(function (p) { productsById[p.id] = p; });
    function save() { store('minue.borrador', draft); }
    var preset = clientsById[draft.clientId];
    if (preset && !draft.desde && !draft.hasta) {
      draft.desde = preset.desde || '';
      draft.hasta = preset.hasta || '';
      draft.recibe = draft.recibe || preset.responsable || '';
    }
    var oldBar = document.getElementById('totalbar');
    if (oldBar) oldBar.remove();

    clear(main);
    main.classList.add('has-totalbar');
    main.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { leave(); go('pedidos'); } }, [icon('back'), 'Pedidos']));
    main.appendChild(el('h1', { text: 'Nuevo pedido' }));
    main.appendChild(el('p', { class: 'sub', text: 'Se guarda en el teléfono hasta que toques Guardar pedido.' }));

    /* 1. Cliente */
    var clientSection = el('section', { class: 'step card' });
    main.appendChild(clientSection);
    function cachedClient(id) {
      var c = cacheGet(cacheKey('clientes'));
      var list = c && c.data && c.data.clientes ? c.data.clientes : [];
      for (var i = 0; i < list.length; i++) if (list[i].clientId === id) return list[i];
      return null;
    }

    function repeatLast(repetir) {
      var skipped = 0;
      repetir.lineas.forEach(function (l) {
        var p = productsById[l.productId];
        if (!p || !(p.precios[l.presentacion] > 0)) { skipped++; return; }
        draft.lines[l.productId] = { presentacion: l.presentacion, cantidad: l.cantidad };
      });
      save();
      drawNuevoPedido(draft);
      toast(skipped ? 'Cargué el último pedido. ' + skipped + (skipped === 1 ? ' producto ya no está disponible.' : ' productos ya no están disponibles.') :
        'Cargué el último pedido. Revisá las cantidades.');
    }

    function drawClient() {
      clear(clientSection);
      clientSection.appendChild(el('h2', { class: 'step-title' }, [el('span', { class: 'step-num', text: '1' }), '¿Para quién?']));
      var c = clientsById[draft.clientId];
      if (c) {
        clientSection.appendChild(el('strong', { style: 'font-size:20px', text: c.nombre }));
        clientSection.appendChild(el('p', { class: 'small', style: 'margin:2px 0 8px', text: c.direccion + ' · ' + nice(c.localidad) + (c.desde ? ' · Recibe ' + c.desde + ' a ' + c.hasta : '') }));
        var hist = cachedClient(c.clientId);
        if (hist && hist.repetir && !Object.keys(draft.lines).length) {
          clientSection.appendChild(el('div', { class: 'repeat' }, [
            el('div', { class: 'small', text: 'Su último pedido · ' + dayLabel(hist.repetir.fecha) + ' · ' + money(hist.repetir.total) }),
            btn('Repetir el último pedido', 'secondary strong', function () { repeatLast(hist.repetir); }, 'repeat')
          ]));
        }
        clientSection.appendChild(btn('Cambiar cliente', 'ghost', function () { draft.clientId = ''; save(); drawClient(); }));
        return;
      }
      var input = el('input', { class: 'input', type: 'search', placeholder: 'Nombre, calle o localidad', 'aria-label': 'Buscar cliente', autocomplete: 'off' });
      var results = el('div', { style: 'margin-top:10px' });
      clientSection.appendChild(el('div', { class: 'search' }, [icon('search'), input]));
      clientSection.appendChild(results);
      function update() {
        clear(results);
        var q = norm(input.value).split(/\s+/).filter(Boolean);
        var list = cat.clientes.filter(function (c) {
          var hay = norm(c.nombre + ' ' + c.direccion + ' ' + c.localidad + ' ' + c.responsable);
          return q.every(function (t) { return hay.indexOf(t) !== -1; });
        }).slice(0, q.length ? 8 : 5);
        list.forEach(function (c) {
          results.appendChild(el('button', { class: 'list-item', type: 'button', onclick: function () {
            draft.clientId = c.clientId;
            draft.desde = c.desde || '';
            draft.hasta = c.hasta || '';
            draft.recibe = c.responsable || '';
            save(); drawClient(); drawWhen(); updateTotal();
          } }, [el('strong', { text: c.nombre }), el('div', { class: 'small', text: c.direccion + ' · ' + nice(c.localidad) })]));
        });
        if (q.length && !list.length) {
          results.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'No lo encontramos' }),
            btn('Crear cliente nuevo', 'secondary', function () {
              openClienteForm(null, input.value, function (newId) {
                draft.clientId = newId; save();
                S.catalog = null;
                openNuevoPedido();
              });
            }, 'plus')]));
        }
      }
      input.addEventListener('input', update);
      update();
    }

    /* 2. Productos */
