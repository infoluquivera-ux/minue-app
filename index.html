    // Afuera del <label>: si no, tocar el ojito también enfocaría el campo dos veces.
    var wrap = node('div', { class: 'login-clave' });
    form.replaceChild(wrap, box);
    wrap.appendChild(box);
    wrap.appendChild(eye);
    var caps = node('p', { class: 'login-caps', 'aria-live': 'polite' });
    caps.hidden = true;
    form.appendChild(caps);
    function mostrar(si) {
      input.type = si ? 'text' : 'password';
      eye.innerHTML = si ? OJO_TACHADO : OJO;
      eye.setAttribute('aria-pressed', String(si));
      eye.setAttribute('aria-label', si ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }
    eye.addEventListener('mousedown', function (e) { e.preventDefault(); });
    eye.addEventListener('click', function () { mostrar(input.type === 'password'); input.focus(); });
    input.addEventListener('keyup', function (e) {
      if (!e.getModifierState) return;
      var activas = e.getModifierState('CapsLock');
      caps.hidden = !activas;
      caps.textContent = activas ? 'Las mayúsculas están activadas.' : '';
    });
    input.ocultar = function () { mostrar(false); };
    return input;
  }

  function sacudir() {
    if (!card) return;
    card.classList.remove('sacude');
    void card.offsetWidth;
    card.classList.add('sacude');
  }

  function submitButton(form, text) {
    var button = node('button', { type: 'submit', class: 'login-submit' }, text);
    form.appendChild(button);
    return button;
  }

  function busy(button, on, text) {
    button.disabled = on;
    button.classList.toggle('cargando', on);
    button.textContent = text;
  }

  function showLogin(message) {
    var conocido = recordado();
    var note = frame(conocido ? 'Hola de nuevo' : 'Bienvenido', message, 'Tu reparto del día, en un solo lugar.');
    var form = node('form', { class: 'login-form' });
    var email = field(form, 'Correo', { type: 'email', autocomplete: 'username', inputmode: 'email', autocapitalize: 'none', spellcheck: 'false', required: 'required' });
    if (conocido) email.value = conocido;
    var pass = passwordField(form, 'Contraseña', { type: 'password', autocomplete: 'current-password', required: 'required' });
    var forgot = node('button', { type: 'button', class: 'login-link' }, 'Olvidé mi contraseña');
    form.appendChild(forgot);
    var button = submitButton(form, 'Entrar');
    card.appendChild(form);

    function say(text) { note.textContent = text; note.hidden = false; sacudir(); }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      busy(button, true, 'Entrando…');
      auth('token?grant_type=password', { email: email.value.trim(), password: pass.value }).then(function (res) {
        return res.json().then(function (data) {
          busy(button, false, 'Entrar');
          if (!res.ok) {
            pass.value = '';
            pass.focus();
            return say(res.status === 429 ? 'Demasiados intentos. Esperá unos minutos.' : 'El correo o la contraseña no son correctos.');
          }
          clearCache();
          keep(data);
          recordar(email.value.trim());
          pass.value = '';
          pass.ocultar();
          overlay.hidden = true;
          if (started) location.reload(); else startApp();
        });
      }).catch(function () {
        busy(button, false, 'Entrar');
        say('No hay señal para entrar. Probá de nuevo.');
      });
    });

    forgot.addEventListener('click', function () { showForgot(email.value.trim()); });
    setTimeout(function () { (email.value ? pass : email).focus(); }, 30);
  }

  function enviarEnlace(correo) {
    return auth('recover?redirect_to=' + encodeURIComponent(cfg.volver || location.origin + location.pathname), { email: correo }).then(function (res) { return res.ok; });
  }

  /** Olvidó la contraseña: le avisa al administrador, que le manda el enlace. También puede pedirlo directo. */
  function showForgot(correo) {
    var note = frame('¿Olvidaste tu contraseña?', '', 'Avisale al administrador y te manda un correo para elegir una nueva.');
    var form = node('form', { class: 'login-form' });
    var email = field(form, 'Tu correo', { type: 'email', autocomplete: 'username', inputmode: 'email', autocapitalize: 'none', spellcheck: 'false', required: 'required' });
    email.value = correo || '';
    var button = submitButton(form, 'Avisar al administrador');
    var directo = node('button', { type: 'button', class: 'login-link' }, 'Prefiero recibir el enlace en mi correo');
    var volver = node('button', { type: 'button', class: 'login-link' }, 'Volver');
    form.appendChild(directo);
    form.appendChild(volver);
    card.appendChild(form);

    function say(text, error) {
      note.textContent = text;
      note.hidden = false;
      if (error) sacudir();
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var quien = email.value.trim();
      var cuerpo = 'Hola. Olvidé mi contraseña de MINUÉ. Mi correo es ' + quien + '.\n\nPara mandarme el enlace: entrá a la app, Ajustes, Usuarios, Mandar enlace.';
      location.href = 'mailto:' + (cfg.admin || '') + '?subject=' + encodeURIComponent('MINUÉ: necesito una contraseña nueva') + '&body=' + encodeURIComponent(cuerpo);
      say('Se abrió tu correo con el mensaje listo. Tocá Enviar. Si no se abrió, escribile a ' + (cfg.admin || 'el administrador') + '.');
    });
    directo.addEventListener('click', function () {
      var quien = email.value.trim();
      if (!quien) return say('Escribí tu correo.', true);
      directo.disabled = true;
      enviarEnlace(quien).then(function (ok) {
        directo.disabled = false;
        say(ok ? 'Si el correo existe, te llegó un mensaje. Revisá también el correo no deseado.' : 'No pudimos mandar el mensaje. Probá más tarde.', !ok);
      }).catch(function () { directo.disabled = false; say('No hay señal. Probá de nuevo.', true); });
    });
    volver.addEventListener('click', function () { showLogin(); });
    setTimeout(function () { (email.value ? button : email).focus(); }, 30);
  }

  /** Viene del enlace del correo de recuperación: pide la contraseña nueva. */
  function showRecovery(token) {
    var note = frame('Elegí una contraseña nueva', '', 'Usá al menos 12 caracteres.');
    var form = node('form', { class: 'login-form' });
    var pass = passwordField(form, 'Contraseña nueva', { type: 'password', autocomplete: 'new-password', minlength: '12', required: 'required' });
    var button = submitButton(form, 'Guardar contraseña');
    card.appendChild(form);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      busy(button, true, 'Guardando…');
      auth('user', { password: pass.value }, token).then(function (res) {
        busy(button, false, 'Guardar contraseña');
        if (!res.ok) {
          note.textContent = 'No se pudo guardar. Usá al menos 12 caracteres o pedí otro correo.';
          note.hidden = false;
          return;
        }
        history.replaceState(null, '', location.pathname);
        session = null;
        save();
        showLogin('Listo. Entrá con tu contraseña nueva.');
      }).catch(function () {
        busy(button, false, 'Guardar contraseña');
        note.textContent = 'No hay señal. Probá de nuevo.';
        note.hidden = false;
      });
    });
  }

  function recordado() {
    if (session && session.email) return session.email;
    try { return localStorage.getItem('minue.correo') || ''; } catch (e) { return ''; }
  }

  function recordar(correo) {
    try { localStorage.setItem('minue.correo', correo); } catch (e) { /* sin almacenamiento */ }
  }

  function clearCache() {
    try { localStorage.removeItem('minue.cache.v2'); } catch (e) { /* sin almacenamiento */ }
  }

  window.MINUE_AUTH = {
    enviarEnlace: enviarEnlace,
    getToken: function () {
      if (fresh()) return Promise.resolve(session.access);
      if (navigator.onLine === false) return Promise.reject({ code: 'NETWORK', message: 'No hay conexión.' });
      return window.MINUE_AUTH.refresh();
    },
    /** Renueva la sesión sin pedir la contraseña. Varias llamadas juntas comparten el mismo pedido. */
    refresh: function () {
      if (refreshing) return refreshing;
      if (!session || !session.refresh) {
        showLogin();
        return Promise.reject({ code: 'AUTH', message: 'Entrá con tu usuario.' });
      }
      refreshing = auth('token?grant_type=refresh_token', { refresh_token: session.refresh }).then(function (res) {
        return res.json().then(function (data) {
          refreshing = null;
          if (!res.ok) {
            session = { email: session.email };
            save();
            showLogin('Tu sesión venció. Entrá de nuevo.');
            throw { code: 'AUTH', message: 'Entrá de nuevo.' };
          }
          keep(data);
          return session.access;
        });
      }, function () {
        refreshing = null;
        throw { code: 'NETWORK', message: 'No hay conexión.' };
      });
      return refreshing;
    },
    rejected: function () {
      session = null;
      save();
      clearCache();
      showLogin('Esa cuenta no está autorizada.');
    },
    signOut: function () {
      var token = session && session.access;
      clearCache();
      function end() {
        session = null;
        save();
        location.reload();
      }
      if (!token || navigator.onLine === false) return end();
      auth('logout', {}, token).then(end, end);
    }
  };

  var hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('type') === 'recovery' && hash.get('access_token')) showRecovery(hash.get('access_token'));
  else if (session && session.refresh) startApp();
  else showLogin();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* sin sw */ }); });
  }
})();
</script>
</body>
</html>
