  /* ---------------- Panel ---------------- */

  function isoMas(key, dias) {
    var d = new Date(key + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + dias);
    return d.toISOString().slice(0, 10);
  }

  function rangoPanel(clave) {
    var hoy = todayKey();
    var dia = new Date(hoy + 'T12:00:00Z');
    if (clave === 'hoy') return { desde: hoy, hasta: hoy };
    if (clave === 'semana') return { desde: isoMas(hoy, -((dia.getUTCDay() + 6) % 7)), hasta: hoy };
    var primero = hoy.slice(0, 8) + '01';
    if (clave === 'mes') return { desde: primero, hasta: hoy };
    var finAnterior = isoMas(primero, -1);
    return { desde: finAnterior.slice(0, 8) + '01', hasta: finAnterior };
  }

  function numero(n) { return new Intl.NumberFormat('es-AR').format(Number(n) || 0); }

  /** "12 % más que del 1 al 5 oct": solo si hay contra qué comparar. */
  function comparar(actual, antes, a) {
    var base = Number(antes);
    if (!(base > 0)) return 'Sin ventas en el período anterior';
    var cambio = Math.round((Number(actual) - base) / base * 100);
    var tramo = dayLabel(a.desde) + ' a ' + dayLabel(a.hasta);
    if (cambio === 0) return 'Igual que ' + tramo;
    return Math.abs(cambio) + ' % ' + (cambio > 0 ? 'más' : 'menos') + ' que ' + tramo;
  }

  function tarjetaDato(titulo, valor) {
    return el('div', { class: 'pill' }, [el('span', { text: titulo }), el('b', { text: valor })]);
  }

  /** Una sola serie: barras finas apoyadas en la base; tocar una muestra su valor. */
  function graficoPanel(serie) {
    var maximo = serie.reduce(function (m, s) { return Math.max(m, Number(s.facturacion)); }, 0);
    var porMes = serie.length > 1 && serie[0].fecha.slice(8) === '01' && serie[1].fecha.slice(8) === '01';
    function nombre(s) {
      return porMes ? new Intl.DateTimeFormat('es-AR', { month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(s.fecha + 'T12:00:00Z')) : dayLabel(s.fecha);
    }
    var lectura = el('p', { class: 'small chart-read', 'aria-live': 'polite', text: 'Tocá una barra para ver el valor.' });
    var barras = el('div', { class: 'chart', role: 'img', 'aria-label': 'Facturación por ' + (porMes ? 'mes' : 'día') + '. El detalle está en la tabla de abajo.' });
    serie.forEach(function (s) {
      var valor = Number(s.facturacion);
      var alto = maximo > 0 ? Math.max(valor > 0 ? 3 : 0, Math.round(valor / maximo * 100)) : 0;
      var texto = nombre(s) + ': ' + money(valor);
      barras.appendChild(el('button', { class: 'chart-col', type: 'button', title: texto, tabindex: '-1', 'aria-hidden': 'true', onclick: function () {
        lectura.textContent = texto;
        barras.querySelectorAll('.chart-col').forEach(function (b) { b.classList.remove('on'); });
        this.classList.add('on');
      } }, [el('i', { style: 'height:' + alto + '%' })]));
    });
    var tabla = el('details', { class: 'chart-table' }, [el('summary', { text: 'Ver como tabla' }),
      el('div', { class: 'summary' }, serie.filter(function (s) { return Number(s.facturacion) > 0; }).map(function (s) { return row(nombre(s), money(s.facturacion)); }))]);
    return el('div', { class: 'card' }, [el('strong', { text: 'Facturación por ' + (porMes ? 'mes' : 'día') }), barras, lectura, tabla]);
  }

  function dibujarPanel(d, caja) {
    var a = d.actual;
    clear(caja);
    if (!a.ventas) {
      caja.appendChild(el('div', { class: 'card empty' }, [el('strong', { text: 'Sin entregas en este período' }), el('span', { text: 'Cuando se entregue un pedido, va a aparecer acá.' })]));
      return;
    }
    caja.appendChild(el('div', { class: 'hero panel-hero' }, [
      el('div', { class: 'hero-kicker', text: 'Facturación para MINUÉ' }),
      el('div', { class: 'panel-big', text: money(a.facturacion) }),
      el('div', { class: 'hero-addr', text: comparar(a.facturacion, d.anterior.facturacion, d.anterior) }),
      el('div', { class: 'hero-kicker panel-gap', text: S.rol === 'admin' ? 'Comisión de Daniel (estimada)' : 'Tu comisión (estimada)' }),
      el('div', { class: 'panel-big', text: money(a.comision) }),
      el('div', { class: 'hero-addr', text: comparar(a.comision, d.anterior.comision, d.anterior) })
    ]));
    caja.appendChild(el('div', { class: 'pills panel-pills' }, [
      tarjetaDato('Bultos', numero(a.bultos)), tarjetaDato('Cajas', numero(a.cajas)), tarjetaDato('Alfajores', numero(a.alfajores)),
      tarjetaDato('Ventas', numero(a.ventas)), tarjetaDato('Clientes', numero(a.clientes)),
      tarjetaDato('Venta promedio', money(Number(a.facturacion) / a.ventas))
    ]));
    caja.appendChild(el('div', { class: 'pills' }, [tarjetaDato('Cobrado en el período', money(a.cobrado)), tarjetaDato('Te deben hoy', money(d.pendiente))]));
    if (d.serie.length > 1) caja.appendChild(graficoPanel(d.serie));
    caja.appendChild(el('h2', { text: 'Por producto' }));
    d.porProducto.forEach(function (p) {
      var partes = [];
      if (Number(p.bultos)) partes.push(numero(p.bultos) + (Number(p.bultos) === 1 ? ' bulto' : ' bultos'));
      if (Number(p.cajas)) partes.push(numero(p.cajas) + (Number(p.cajas) === 1 ? ' caja' : ' cajas'));
      partes.push(numero(p.alfajores) + ' alfajores');
      caja.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'row' }, [el('strong', { text: p.producto }), el('span', { class: 'money', text: money(p.facturacion) })]),
        el('div', { class: 'small', text: partes.join(' · ') }),
        el('div', { class: 'small', text: 'Comisión ' + money(p.comision) + ' (' + String(Math.round(Number(p.comision) / Number(p.facturacion) * 1000) / 10).replace('.', ',') + ' % de ' + money(p.facturacion) + ')' })
      ]));
    });
    caja.appendChild(el('h2', { text: 'Mejores clientes' }));
    caja.appendChild(el('div', { class: 'summary' }, d.porCliente.map(function (c) { return row(c.cliente, money(c.facturacion)); })));
    caja.appendChild(el('p', { class: 'small', text: 'Es una estimación para ver cómo vienen las ventas. No es una liquidación ni un comprobante fiscal.' }));
  }

  function renderPanel() {
    S.current = renderPanel;
    setFab(false);
    clear(main);
    S.panel = S.panel || { clave: 'mes' };
    var r = S.panel.clave === 'elegir' ? S.panel : rangoPanel(S.panel.clave);
    main.appendChild(el('h1', { text: 'Panel' }));
    main.appendChild(chipRow([['hoy', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['anterior', 'Mes anterior'], ['elegir', 'Elegir']], S.panel.clave, function (c) {
      S.panel.clave = c;
      if (c === 'elegir' && !S.panel.desde) { var m = rangoPanel('mes'); S.panel.desde = m.desde; S.panel.hasta = m.hasta; }
      renderPanel();
    }, 'Período'));
    if (S.panel.clave === 'elegir') {
      var desde = el('input', { class: 'input', type: 'date', value: S.panel.desde, 'aria-label': 'Desde' });
      var hasta = el('input', { class: 'input', type: 'date', value: S.panel.hasta, 'aria-label': 'Hasta' });
      main.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Desde' }), desde]));
      main.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Hasta' }), hasta]));
      main.appendChild(btn('Ver', 'secondary', function () { S.panel.desde = desde.value; S.panel.hasta = hasta.value; renderPanel(); }));
    }
    main.appendChild(el('p', { class: 'small', text: dayLabel(r.desde) + (r.hasta !== r.desde ? ' a ' + dayLabel(r.hasta) : '') }));
    var caja = el('div');
    caja.appendChild(el('div', { class: 'skeleton' }));
    main.appendChild(caja);
    var pedido = (S.panelId = (S.panelId || 0) + 1);
    call('panel', { desde: r.desde, hasta: r.hasta }).then(function (d) {
      if (pedido !== S.panelId || S.current !== renderPanel) return;
      dibujarPanel(d, caja);
    }, function (e) {
      if (pedido !== S.panelId) return;
      clear(caja);
      caja.appendChild(el('div', { class: 'card empty' }, [el('strong', { text: 'No se pudo cargar' }), el('p', { text: e.message || 'Probá de nuevo.' }), btn('Probar de nuevo', 'primary', renderPanel)]));
    });
  }

  function celda(valor) {
    var texto = typeof valor === 'number' ? String(valor).replace('.', ',') : String(valor === null || valor === undefined ? '' : valor);

      cinta.scrollTo({ left: i * cinta.clientWidth, behavior: quieto ? 'auto' : 'smooth' });
      actual = i;
      moviendo = true;
      clearTimeout(fin);
      fin = setTimeout(function () { moviendo = false; }, 900);
      pintar();
    }

    var espera = null;
    var moviendo = false;
    var fin = null;
    cinta.addEventListener('scroll', function () {
      clearTimeout(espera);
      espera = setTimeout(function () {
        if (moviendo) return;
        var i = Math.round(cinta.scrollLeft / Math.max(cinta.clientWidth, 1));
        if (i !== actual) { actual = i; pintar(); }
      }, 80);
    });
    cinta.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); irA(actual + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); irA(actual - 1); }
    });
    pintar();
    window.scrollTo(0, 0);
  }

  /* ---------------- Mapa y ubicaciones ---------------- */

  var mapaCargando = null;

  /** El mapa se baja solo cuando hace falta: la app sigue liviana y funciona sin él. */
  function cargarMapa() {
    if (window.L) return Promise.resolve(window.L);
    if (!mapaCargando) {
      mapaCargando = new Promise(function (ok, mal) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'leaflet/leaflet.css';
        document.head.appendChild(css);
        var js = document.createElement('script');
        js.src = 'leaflet/leaflet.js';
        js.onload = function () { ok(window.L); };
        js.onerror = function () { mapaCargando = null; mal(new Error('sin mapa')); };
        document.head.appendChild(js);
      });
    }
    return mapaCargando;
  }

  function crearMapa(caja, L) {
    var mapa = L.map(caja, { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(mapa);
    return mapa;
  }

  function pinMapa(L, texto, clase) {
    return L.divIcon({ className: 'pin' + (clase ? ' ' + clase : ''), html: '<span>' + texto + '</span>', iconSize: [32, 32], iconAnchor: [16, 16] });
  }

  function miUbicacion() {
    return new Promise(function (ok, mal) {
      if (!navigator.geolocation) { mal(new Error('Este teléfono no permite leer la ubicación.')); return; }
      navigator.geolocation.getCurrentPosition(function (p) {
        ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy });
      }, function () {
        mal(new Error('No pudimos leer la ubicación. Revisá que esté activada y permitida para esta app.'));
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
    });
  }

  /** Marca dónde queda un local o el punto de salida: GPS, buscando la dirección o tocando el mapa. */
  function openUbicar(o) {
    var punto = o.lat != null && o.lng != null ? { lat: o.lat, lng: o.lng } : null;
    var mapa = null;
    var marca = null;
    var L = null;
    var requestId = uuid();
    var caja = el('div', { class: 'mapa', role: 'application', 'aria-label': 'Mapa para marcar la ubicación' });
    var estado = el('p', { class: 'small', 'aria-live': 'polite', text: punto ? 'Ubicación guardada. Tocá el mapa para corregirla.' : 'Todavía sin marcar.' });
    var error = el('div', { class: 'error-box', hidden: true });
    var save = el('button', { class: 'btn primary', type: 'button', text: 'Guardar ubicación' });
    save.disabled = !punto;

    function marcar(p, mensaje) {
      punto = { lat: p.lat, lng: p.lng };
      save.disabled = false;
      estado.textContent = mensaje;
      if (!mapa) return;
      if (marca) marca.setLatLng(punto);
      else marca = L.marker(punto, { icon: pinMapa(L, '•', 'base') }).addTo(mapa);
      mapa.setView(punto, Math.max(mapa.getZoom() || 0, 16));
    }

    function aviso(texto) {
      error.textContent = texto;
      error.hidden = false;
    }

    var gps = btn('Estoy acá ahora', 'secondary', function () {
      error.hidden = true;
      setBusy(gps, 'Buscando…');
      miUbicacion().then(function (p) {
        unsetBusy(gps);
        marcar(p, p.precision > 100 ? 'Marcado, pero el GPS es poco preciso (' + Math.round(p.precision) + ' m). Revisá el punto.' : 'Marcado donde estás.');
      }, function (e) { unsetBusy(gps); aviso(e.message); });
    }, 'map');

    var buscar = btn('Buscar la dirección', 'ghost', function () {
      error.hidden = true;
      setBusy(buscar, 'Buscando…');
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ar&q=' + encodeURIComponent(o.direccion || '')).then(function (r) {
        if (!r.ok) throw new Error('falló');
        return r.json();
      }).then(function (lista) {
        unsetBusy(buscar);
        if (!lista.length) { aviso('No encontramos esa dirección. Marcala tocando el mapa.'); return; }
        marcar({ lat: Number(lista[0].lat), lng: Number(lista[0].lon) }, 'Encontrada. Revisá que el punto esté bien y corregilo tocando el mapa.');
      }, function () { unsetBusy(buscar); aviso('No pudimos buscar la dirección. Probá con "Estoy acá ahora".'); });
    });

    save.addEventListener('click', function () {
      error.hidden = true;
      setBusy(save, 'Guardando…');
      write('guardarUbicacion', { requestId: requestId, clientId: o.clientId || '', base: !!o.base, lat: punto.lat, lng: punto.lng }, 'Ubicación de ' + o.titulo).then(function () {
        closeSheet(true);
        toast('Ubicación guardada.');
        if (o.onSaved) o.onSaved(punto);
      }, function (e) {
        unsetBusy(save);
        aviso(e.code === 'NETWORK' ? 'No hay señal. Quedó arriba para reintentar.' : e.message || 'No se pudo guardar.');
      });
    });

    openSheet([el('h2', { text: 'Ubicación' }), el('p', { class: 'small', text: o.titulo + (o.direccion ? ' · ' + o.direccion : '') }),
      caja, estado, error, el('div', { class: 'stack' }, [gps, buscar, save])], 'Marcar la ubicación');

    cargarMapa().then(function (lib) {
      L = lib;
      mapa = crearMapa(caja, L);
      var inicio = punto || (o.cerca && o.cerca.lat != null ? o.cerca : { lat: -34.66, lng: -58.37 });
      mapa.setView(inicio, punto ? 16 : 13);
      if (punto) marca = L.marker(punto, { icon: pinMapa(L, '•', 'base') }).addTo(mapa);
      mapa.on('click', function (e) { marcar(e.latlng, 'Marcado en el mapa.'); });
      setTimeout(function () { mapa.invalidateSize(); if (o.auto && !punto) buscar.click(); }, 250);
    }, function () {
      caja.hidden = true;
      estado.textContent = 'El mapa no se pudo abrir. Con "Estoy acá ahora" podés guardar la ubicación igual.';
    });
  }

  /* ---------------- Armar el recorrido ---------------- */

  function renderArmar(fecha) {
    var dia = fecha || todayKey();
    S.current = function () { if (S.armar && S.armar.fecha === dia) pintarArmar(); else renderArmar(dia); };
    S.armar = null;
    setFab(false);
    var id = ++S.renderId;
    loading();
    call('armarRecorrido', { fecha: dia }).then(function (d) {
      if (id !== S.renderId) return;
      S.armar = estadoArmar(d);
      calcularArmar(!S.armar.manual);
      pintarArmar();
    }, function (e) { showError(e, function () { renderArmar(dia); }); });
  }

  function paradaArmar(cliente, pedido, a) {
    var p = pedido || {};
    return { key: p.pedidoId || 'c' + cliente.clienteId, clienteId: cliente.clienteId, pedidoId: p.pedidoId || '', nombre: cliente.nombre,
      direccion: cliente.direccion, localidad: cliente.localidad, lat: cliente.lat, lng: cliente.lng, minutos: a.minutos,
      fijo: !!p.fijo, desde: p.desde || cliente.desde || '', hasta: p.hasta || cliente.hasta || '' };
  }

  function estadoArmar(d) {
    var a = { fecha: d.fecha, salida: d.ajustes.salida, volver: d.ajustes.volver, minutos: d.ajustes.minutos, base: d.base,
      inicio: d.base.lat != null ? { lat: d.base.lat, lng: d.base.lng } : null, origen: 'base', manual: false, buscar: '', ahorro: 0,
      pedidos: d.pedidos, clientes: d.clientes, leToca: d.leToca, sugeridos: d.sugeridos || [], paradas: [], res: null, requestId: uuid() };
    var clientes = {};
    d.clientes.forEach(function (c) { clientes[c.clienteId] = c; });
    function clienteDe(p) {
      return clientes[p.clienteId] || { clienteId: p.clienteId, nombre: p.cliente, direccion: p.direccion, localidad: p.localidad, lat: p.lat, lng: p.lng };
    }
    if (d.plan) {
      a.salida = d.plan.salida;
      a.volver = d.plan.regreso;
      a.manual = true;
      d.plan.paradas.forEach(function (s) {
        var pedido = d.pedidos.filter(function (p) { return p.pedidoId === s.pedidoId; })[0];
        if (s.pedidoId && !pedido) return; // Ya se entregó: no vuelve a la lista.
        if (!clientes[s.clienteId]) return;
        var x = paradaArmar(clientes[s.clienteId], pedido, a);
        x.minutos = s.minutos;
        x.fijo = s.fijo;
        x.desde = s.desde;
        x.hasta = s.hasta;
        a.paradas.push(x);
      });
    } else {
      d.pedidos.forEach(function (p) { a.paradas.push(paradaArmar(clienteDe(p), p, a)); });
    }
    return a;
  }

  function calcularArmar(sugerir) {
    var a = S.armar;
    a.res = null;
    if (!a.inicio || !a.paradas.length) return;
    var ruta = window.MINUE_RUTA;
    var posicion = 0;
    var paradas = a.paradas.map(function (p) {
      var ubicada = p.lat != null && p.lng != null;
      return { id: p.key, lat: p.lat, lng: p.lng, minutos: p.minutos, fijo: p.fijo, desde: p.desde, hasta: p.hasta, ref: p, posicion: !sugerir && ubicada ? posicion++ : null };
    });
    a.res = ruta.planificar({ inicio: a.inicio, fin: a.volver ? (a.base.lat != null ? a.base : a.inicio) : null, salida: ruta.toMinutes(a.salida) || 480, paradas: paradas });
    if (sugerir) {
      a.paradas = a.res.paradas.map(function (x) { return x.parada.ref; }).concat(a.res.sinUbicar.map(function (x) { return x.ref; }));
      a.manual = false;
      a.ahorro = a.res.ahorroMin;
    }
  }

  function duracionTexto(min) {
    var h = Math.floor(min / 60);
    var m = min % 60;
    return h ? h + ' h' + (m ? ' ' + m + ' min' : '') : m + ' min';
  }

  function moverParada(i, delta) {
    var a = S.armar;
    var otra = i + delta;
    if (otra < 0 || otra >= a.paradas.length) return;
    var x = a.paradas[i];
    a.paradas[i] = a.paradas[otra];
    a.paradas[otra] = x;
    a.manual = true;
    a.ahorro = 0;
    calcularArmar(false);
    pintarArmar();
    var fila = document.getElementById('parada-' + otra);
    if (fila) fila.scrollIntoView({ block: 'nearest' });
  }

  function agregarParada(cliente, pedido) {
    var a = S.armar;
    a.paradas.push(paradaArmar(cliente, pedido, a));
    a.buscar = '';
    calcularArmar(!a.manual);
    pintarArmar();
  }

  function quitarParada(p) {
    var a = S.armar;
    a.paradas = a.paradas.filter(function (x) { return x !== p; });
    calcularArmar(!a.manual);
    pintarArmar();
  }

  function openParada(p) {
    var f = { fijo: p.fijo };
    var error = el('div', { class: 'error-box', hidden: true });
    var chips = el('div');
    var desde = el('input', { class: 'input', type: 'time', value: p.desde, 'aria-label': 'Desde' });
    var hasta = el('input', { class: 'input', type: 'time', value: p.hasta, 'aria-label': 'Hasta' });
    var minutos = el('input', { class: 'input', inputmode: 'numeric', value: String(p.minutos), 'aria-label': 'Minutos en el local' });
    var ayuda = el('p', { class: 'small' });
    function dibujar() {
      clear(chips);
      chips.appendChild(chipRow([[false, 'Libre'], [true, 'Fijo']], f.fijo, function (v) { f.fijo = v; dibujar(); }, 'Tipo de horario'));
      ayuda.textContent = f.fijo ? 'El recorrido se arma para llegar dentro de ese horario.' : 'Pasás cuando te quede mejor en el camino.';
    }
    dibujar();
    openSheet([el('h2', { text: p.nombre }), el('p', { class: 'small', text: p.direccion }), chips, ayuda,
      el('div', { class: 'grid2' }, [el('label', { class: 'field' }, [el('span', { text: 'Desde' }), desde]), el('label', { class: 'field' }, [el('span', { text: 'Hasta' }), hasta])]),
      el('label', { class: 'field' }, [el('span', { text: 'Minutos en el local' }), minutos]), error,
      btn('Listo', 'primary', function () {
        var m = Number(minutos.value);
        if (!(m >= 0 && m <= 240)) { error.textContent = 'Escribí los minutos, de 0 a 240.'; error.hidden = false; return; }
        if (f.fijo && (!desde.value || !hasta.value || hasta.value < desde.value)) { error.textContent = 'Para un horario fijo hacen falta el "desde" y el "hasta".'; error.hidden = false; return; }
        p.fijo = f.fijo;
        p.desde = desde.value;
        p.hasta = hasta.value;
        p.minutos = Math.round(m);
        closeSheet(true);
        calcularArmar(!S.armar.manual);
        pintarArmar();
      })], 'Horario de la parada');
  }

  function pintarMapaArmar(caja) {
    var a = S.armar;
    if (S.armarMapa) { S.armarMapa.remove(); S.armarMapa = null; }
    var aviso = function () {
      clear(caja);
      caja.appendChild(el('p', { class: 'small mapa-aviso', text: 'Sin señal no podemos mostrar el mapa. La lista sirve igual.' }));
    };
    if (navigator.onLine === false) { aviso(); return; }
    cargarMapa().then(function (L) {
      if (!caja.isConnected || S.armar !== a) return;
      var mapa = crearMapa(caja, L);
      S.armarMapa = mapa;
      var puntos = [];
      if (a.inicio) {
        puntos.push([a.inicio.lat, a.inicio.lng]);
        L.marker(puntos[0], { icon: pinMapa(L, '⌂', 'base'), title: 'Salida' }).addTo(mapa);
      }
      (a.res ? a.res.paradas : []).forEach(function (x, i) {
        var punto = [x.parada.lat, x.parada.lng];
        puntos.push(punto);
        L.marker(punto, { icon: pinMapa(L, String(i + 1), x.tarde > 0 ? 'tarde' : ''), title: x.parada.ref.nombre }).addTo(mapa)
          .bindPopup(document.createTextNode(x.parada.ref.nombre + ' · ' + x.llegada));
      });
      if (puntos.length > 1) {
        var linea = a.volver && a.inicio ? puntos.concat([puntos[0]]) : puntos;
        L.polyline(linea, { color: '#B45309', weight: 3, opacity: .75 }).addTo(mapa);
        mapa.fitBounds(puntos, { padding: [28, 28], maxZoom: 15 });
      } else if (puntos.length) mapa.setView(puntos[0], 14);
      else mapa.setView([-34.66, -58.37], 11);
      setTimeout(function () { if (S.armarMapa === mapa) mapa.invalidateSize(); }, 200);
    }, aviso);
  }

  function pintarArmar() {
    var a = S.armar;
    if (!a) return;
    if (S.armarMapa) { S.armarMapa.remove(); S.armarMapa = null; }
    clear(main);
    main.appendChild(el('h1', { text: 'Armar recorrido' }));

    var cuando = a.fecha === todayKey() ? 'hoy' : a.fecha === todayKey(1) ? 'manana' : 'otro';
    var fecha = el('input', { class: 'input', type: 'date', value: a.fecha, min: todayKey(), 'aria-label': 'Fecha del recorrido' });
    fecha.addEventListener('change', function () { if (fecha.value) renderArmar(fecha.value); });
    var salida = el('input', { class: 'input', type: 'time', value: a.salida, 'aria-label': 'Hora de salida' });
    salida.addEventListener('change', function () {
      if (!salida.value) return;
      a.salida = salida.value;
      calcularArmar(!a.manual);
      pintarArmar();
    });
    var opciones = el('div', { class: 'card' }, [
      chipRow([['hoy', 'Hoy'], ['manana', 'Mañana']], cuando, function (v) { renderArmar(todayKey(v === 'hoy' ? 0 : 1)); }, 'Día del recorrido'),
      el('div', { class: 'grid2' }, [el('label', { class: 'field' }, [el('span', { text: 'Día' }), fecha]), el('label', { class: 'field' }, [el('span', { text: 'Salís a las' }), salida])])
    ]);
    if (cuando === 'hoy') {
      opciones.appendChild(el('div', { class: 'field' }, [el('span', { class: 'field-title', text: 'Salís desde' }),
        chipRow([['base', 'La base'], ['aca', 'Donde estoy']], a.origen, function (v) {
          if (v === 'base') {
            a.origen = 'base';
            a.inicio = a.base.lat != null ? { lat: a.base.lat, lng: a.base.lng } : null;
            calcularArmar(!a.manual);
            pintarArmar();
            return;
          }
          toast('Buscando dónde estás…');
          miUbicacion().then(function (p) {
            a.origen = 'aca';
            a.inicio = { lat: p.lat, lng: p.lng };
            a.salida = window.MINUE_RUTA.hora(window.MINUE_RUTA.nowMinutes());
            calcularArmar(!a.manual);
            pintarArmar();
          }, function (e) { toast(e.message, { error: true }); });
        }, 'Lugar de salida')]));
    }
    opciones.appendChild(el('div', { class: 'field' }, [el('span', { class: 'field-title', text: 'Al terminar' }),
      chipRow([[true, 'Vuelvo a la base'], [false, 'Termino en la última']], a.volver, function (v) {
        a.volver = v;
        calcularArmar(!a.manual);
        pintarArmar();
      }, 'Al terminar')]));
    main.appendChild(opciones);

    if (!a.inicio) {
      main.appendChild(el('div', { class: 'note', text: 'Falta marcar en el mapa desde dónde salís. Sin eso no podemos calcular los tiempos.' }));
      if (S.rol === 'admin') {
        main.appendChild(btn('Marcar la salida', 'secondary', function () {
          openUbicar({ base: true, titulo: 'Salida', direccion: a.base.address, onSaved: function (p) {
            a.base.lat = p.lat;
            a.base.lng = p.lng;
            a.inicio = p;
            calcularArmar(!a.manual);
            pintarArmar();
          } });
        }, 'map'));
      }
    }

    var r = a.res;
    if (r && r.paradas.length) {
      main.appendChild(el('section', { class: 'hero plan-resumen', 'aria-label': 'Resumen del recorrido' }, [
        el('div', { class: 'hero-kicker', text: a.volver ? 'Volvés a las' : 'Terminás a las' }),
        el('div', { class: 'panel-big', text: r.regreso }),
        el('div', { class: 'plan-datos' }, [
          el('span', { text: a.paradas.length + (a.paradas.length === 1 ? ' parada' : ' paradas') }),
          el('span', { text: duracionTexto(r.duracionMin) }),
          el('span', { text: String(r.km).replace('.', ',') + ' km' })
        ])
      ]));
      if (r.demoradas) main.appendChild(el('div', { class: 'error-box', text: r.demoradas === 1 ? 'Una parada llega tarde a su horario. Revisala abajo.' : r.demoradas + ' paradas llegan tarde a su horario. Revisalas abajo.' }));
      if (a.ahorro >= 5) main.appendChild(el('p', { class: 'small', text: 'Este orden te ahorra unos ' + a.ahorro + ' min.' }));
    }

    var cajaMapa = el('div', { class: 'mapa', role: 'img', 'aria-label': 'Mapa del recorrido. El orden y las horas están en la lista de abajo.' });
    if (a.paradas.length || a.inicio) main.appendChild(cajaMapa);

    main.appendChild(el('h2', { text: 'Paradas' }));
    if (!a.paradas.length) main.appendChild(el('div', { class: 'card empty' }, [el('strong', { text: 'Todavía no elegiste a quién visitar' }), el('span', { text: 'Sumá clientes desde la lista de abajo.' })]));
    var detalle = {};
    if (r) r.paradas.forEach(function (x) { detalle[x.parada.ref.key] = x; });
    a.paradas.forEach(function (p, i) {
      var x = detalle[p.key];
      var textoHorario = p.fijo ? 'Fijo ' + p.desde + ' a ' + p.hasta : 'Horario libre';
      var sinUbicar = p.lat == null || p.lng == null;
      main.appendChild(el('div', { class: 'parada', id: 'parada-' + i }, [
        el('span', { class: 'parada-num' + (x && x.tarde > 0 ? ' tarde' : ''), text: String(i + 1) }),
        el('div', { class: 'parada-texto' }, [
          el('strong', { text: p.nombre }),
          el('div', { class: 'small', text: p.direccion + ' · ' + nice(p.localidad) }),
          x ? el('div', { class: 'parada-hora', text: 'Llegás ' + x.llegada + ' · ' + x.tramoMin + ' min de viaje' }) : null,
          x && x.motivo ? el('div', { class: 'small' + (x.tarde > 0 ? ' late-text' : ''), text: x.motivo }) : null,
          !p.pedidoId ? el('div', { class: 'small', text: 'Visita sin pedido' }) : null,
          sinUbicar ? el('div', { class: 'small late-text', text: 'Sin ubicación: no entra en el cálculo' }) : null,
          el('div', { class: 'parada-acciones' }, [
            el('button', { class: 'chip', type: 'button', text: textoHorario, onclick: function () { openParada(p); } }),
            sinUbicar ? el('button', { class: 'chip', type: 'button', text: 'Ubicar', onclick: function () {
              openUbicar({ clientId: p.clienteId, titulo: p.nombre, direccion: p.direccion + ', ' + p.localidad, cerca: a.inicio, onSaved: function (punto) {
                a.paradas.concat(a.clientes).forEach(function (c) { if (c.clienteId === p.clienteId) { c.lat = punto.lat; c.lng = punto.lng; } });
                calcularArmar(!a.manual);
                pintarArmar();
              } });
            } }) : null,
            el('button', { class: 'chip', type: 'button', text: 'Quitar', 'aria-label': 'Quitar a ' + p.nombre, onclick: function () { quitarParada(p); } })
          ])
        ]),
        el('div', { class: 'parada-mover' }, [
          el('button', { type: 'button', text: '↑', 'aria-label': 'Subir a ' + p.nombre, disabled: i === 0 ? 'disabled' : null, onclick: function () { moverParada(i, -1); } }),
          el('button', { type: 'button', text: '↓', 'aria-label': 'Bajar a ' + p.nombre, disabled: i === a.paradas.length - 1 ? 'disabled' : null, onclick: function () { moverParada(i, 1); } })
        ])
      ]));
    });

    var elegidos = {};
    a.paradas.forEach(function (p) { elegidos[p.key] = true; elegidos['c' + p.clienteId] = true; });
    var sinSumar = a.pedidos.filter(function (p) { return !elegidos[p.pedidoId]; });
    if (sinSumar.length) {
      main.appendChild(el('h2', { text: 'Pedidos sin sumar' }));
      sinSumar.forEach(function (p) {
        var c = a.clientes.filter(function (x) { return x.clienteId === p.clienteId; })[0] || { clienteId: p.clienteId, nombre: p.cliente, direccion: p.direccion, localidad: p.localidad, lat: p.lat, lng: p.lng };
        main.appendChild(btn(p.cliente + ' · ' + dayLabel(p.fecha), 'secondary', function () { agregarParada(c, p); }, 'plus'));
      });
    }
    if (!a.clientes.length) {
      main.appendChild(el('div', { class: 'card empty' }, [el('strong', { text: 'Primero cargá tus clientes' }), el('span', { text: 'Después los elegís acá para armar el recorrido.' }),
        el('div', { style: 'margin-top:12px' }, [btn('Cargar cliente', 'primary', function () { go('clientes'); openClienteForm(null); }, 'plus')])]));
    }
    var conPedido = {};
    a.pedidos.forEach(function (p) { conPedido[p.clienteId] = true; });
    var delDia = a.sugeridos.map(function (id) { return a.clientes.filter(function (c) { return c.clienteId === id; })[0]; })
      .filter(function (c) { return c && !elegidos['c' + c.clienteId] && !conPedido[c.clienteId]; });
    if (delDia.length) {
      var nombreDia = ['domingos', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados'][new Date(a.fecha + 'T12:00:00').getDay()];
      main.appendChild(el('h2', { text: 'Suelen recibir los ' + nombreDia }));
      delDia.forEach(function (c) {
        main.appendChild(el('button', { class: 'list-item', type: 'button', onclick: function () { agregarParada(c); } }, [
          el('div', { class: 'row' }, [el('strong', { text: c.nombre }), el('span', { class: 'badge', text: 'Sumar' })]),
          el('div', { class: 'small', text: c.direccion + ' · ' + nice(c.localidad) })
        ]));
      });
      if (delDia.length > 1) main.appendChild(btn('Sumar a todos', 'secondary', function () {
        delDia.forEach(function (c) { a.paradas.push(paradaArmar(c, null, a)); });
        calcularArmar(!a.manual);
        pintarArmar();
      }, 'plus'));
    }
    var toca = a.leToca.filter(function (l) { return !elegidos['c' + l.clienteId]; });
    if (toca.length) {
      main.appendChild(el('h2', { text: 'Les toca comprar' }));
      toca.forEach(function (l) {
        var c = a.clientes.filter(function (x) { return x.clienteId === l.clienteId; })[0];
        if (!c) return;
        main.appendChild(el('button', { class: 'list-item', type: 'button', onclick: function () { agregarParada(c); } }, [
          el('span', {}, [el('strong', { text: l.nombre }), el('div', { class: 'small', text: 'Compra cada ' + l.cadaDias + ' días · última ' + dayLabel(l.ultimaCompra) })]),
          el('span', { class: 'badge' + (l.estado === 'En riesgo' ? ' crit' : ' urgent'), text: l.estado })
        ]));
      });
    }

    main.appendChild(el('h2', { text: 'Sumar otro cliente' }));
    var buscar = el('input', { class: 'input', type: 'search', value: a.buscar, placeholder: 'Nombre o dirección', 'aria-label': 'Buscar cliente' });
    var resultados = el('div', { class: 'stack' });
    function filtrar() {
      clear(resultados);
      var q = norm(buscar.value);
      if (!q) return;
      var lista = a.clientes.filter(function (c) { return !elegidos['c' + c.clienteId] && norm(c.nombre + ' ' + c.direccion).indexOf(q) !== -1; }).slice(0, 6);
      if (!lista.length) resultados.appendChild(el('p', { class: 'small', text: 'No encontramos ese cliente.' }));
      lista.forEach(function (c) { resultados.appendChild(btn(c.nombre, 'secondary', function () { agregarParada(c); }, 'plus')); });
    }
    buscar.addEventListener('input', function () { a.buscar = buscar.value; filtrar(); });
    main.appendChild(el('div', { class: 'field' }, [buscar]));
    main.appendChild(resultados);
    filtrar();

    var error = el('div', { class: 'error-box', hidden: true });
    var guardar = el('button', { class: 'btn primary', type: 'button', text: 'Guardar recorrido' });
    guardar.disabled = !a.paradas.length;
    guardar.addEventListener('click', function () {
      error.hidden = true;
      setBusy(guardar, 'Guardando…');
      var res = a.res;
      var detallePor = {};
      if (res) res.paradas.forEach(function (x) { detallePor[x.parada.ref.key] = x; });
      write('guardarRecorrido', { requestId: a.requestId, fecha: a.fecha, salida: a.salida, inicio: a.origen === 'aca' ? a.inicio : null, regreso: a.volver,
        resumen: res ? { km: res.km, regreso: res.regreso, minutos: res.duracionMin, demoradas: res.demoradas } : {},
        paradas: a.paradas.map(function (p) {
          var x = detallePor[p.key];
          return { clienteId: p.clienteId, pedidoId: p.pedidoId, minutos: p.minutos, fijo: p.fijo, desde: p.desde, hasta: p.hasta,
            fijada: a.manual, llegada: x ? x.llegada : '', motivo: x ? x.motivo : '' };
        }) }, 'Recorrido del ' + dayLabel(a.fecha)).then(function () {
        toast('Recorrido guardado.');
        if (a.fecha === todayKey()) go('inicio');
        else renderArmar(a.fecha);
      }, function (e) {
        unsetBusy(guardar);
        error.textContent = e.code === 'NETWORK' ? 'No hay señal. Quedó arriba para reintentar.' : e.message || 'No se pudo guardar.';
        error.hidden = false;
      });
    });
    main.appendChild(el('div', { class: 'stack armar-fin' }, [
      a.manual && a.paradas.length > 1 && a.inicio ? btn('Sugerir orden', 'secondary', function () { calcularArmar(true); pintarArmar(); }, 'route') : null,
      error, guardar,
      el('p', { class: 'small', text: 'Orden sugerido. Las horas son aproximadas: no tienen en cuenta el tránsito.' })
    ]));
    if (a.paradas.length || a.inicio) pintarMapaArmar(cajaMapa);
  }

  /* ---------------- Nuevo pedido ---------------- */

  function emptyDraft(clientId) {
    return { clientId: clientId || '', lines: {}, fecha: todayKey(), desde: '', hasta: '', prioridad: 'NORMAL', pago: 'no',
      importe: '', medio: 'EFECTIVO', recibe: '', observaciones: '', requestId: '' };
  }

  function openNuevoPedido(clientId, paradaId) {
    var draft = load('minue.borrador', null);
    if (clientId && (!draft || draft.clientId !== clientId)) draft = emptyDraft(clientId);
    if (!draft) draft = emptyDraft();
    if (paradaId) draft.paradaId = paradaId;
    S.current = function () { openNuevoPedido(); };
    S.tab = 'pedidos';
    markTab('pedidos');
    setFab(false);
    var id = ++S.renderId;
    if (S.catalog && Date.now() - S.catalogT < 300000) {
      if (S.leave) { S.leave(); S.leave = null; }
      if (!sheet.hidden) closeSheet(true);
      drawNuevoPedido(draft);
      return;
    }
    loading();
    var run = function () {
      call('catalogo', {}).then(function (catalog) {
        if (id !== S.renderId) return;
        S.catalog = catalog;
        S.catalogT = Date.now();
        drawNuevoPedido(draft);
      }, function (error) { if (id === S.renderId) showError(error, run); });
    };
    run();
  }

  function markTab(tab) {
    document.querySelectorAll('.tab').forEach(function (t) {
      if (t.getAttribute('data-tab') === tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
  }

  function drawNuevoPedido(draft) {
    var cat = S.catalog;
    var clientsById = {};
    cat.clientes.forEach(function (c) { clientsById[c.clientId] = c; });
    var productsById = {};
    cat.productos.forEach(function (p) { productsById[p.id] = p; });
    function save() { store('minue.borrador', draft); }
    var preset = clientsById[draft.clientId];
    if (preset && !draft.desde && !draft.hasta) {
      draft.desde = preset.desde || '';
      draft.hasta = preset.hasta || '';
      draft.recibe = draft.recibe || preset.responsable || '';
    }
    var oldBar = document.getElementById('totalbar');
    if (oldBar) oldBar.remove();

    clear(main);
    main.classList.add('has-totalbar');
    main.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { leave(); go('pedidos'); } }, [icon('back'), 'Pedidos']));
    main.appendChild(el('h1', { text: 'Nuevo pedido' }));
    main.appendChild(el('p', { class: 'sub', text: 'Se guarda en el teléfono hasta que toques Guardar pedido.' }));

    /* 1. Cliente */
    var clientSection = el('section', { class: 'step card' });
    main.appendChild(clientSection);
    function cachedClient(id) {
      var c = cacheGet(cacheKey('clientes'));
      var list = c && c.data && c.data.clientes ? c.data.clientes : [];
      for (var i = 0; i < list.length; i++) if (list[i].clientId === id) return list[i];
      return null;
    }

    function repeatLast(repetir) {
      var skipped = 0;
      repetir.lineas.forEach(function (l) {
        var p = productsById[l.productId];
        if (!p || !(p.precios[l.presentacion] > 0)) { skipped++; return; }
        draft.lines[l.productId] = { presentacion: l.presentacion, cantidad: l.cantidad };
      });
      save();
      drawNuevoPedido(draft);
      toast(skipped ? 'Cargué el último pedido. ' + skipped + (skipped === 1 ? ' producto ya no está disponible.' : ' productos ya no están disponibles.') :
        'Cargué el último pedido. Revisá las cantidades.');
    }

    function drawClient() {
      clear(clientSection);
      clientSection.appendChild(el('h2', { class: 'step-title' }, [el('span', { class: 'step-num', text: '1' }), '¿Para quién?']));
      var c = clientsById[draft.clientId];
      if (c) {
        clientSection.appendChild(el('strong', { style: 'font-size:20px', text: c.nombre }));
        clientSection.appendChild(el('p', { class: 'small', style: 'margin:2px 0 8px', text: c.direccion + ' · ' + nice(c.localidad) + (c.desde ? ' · Recibe ' + c.desde + ' a ' + c.hasta : '') }));
        var hist = cachedClient(c.clientId);
        if (hist && hist.repetir && !Object.keys(draft.lines).length) {
          clientSection.appendChild(el('div', { class: 'repeat' }, [
            el('div', { class: 'small', text: 'Su último pedido · ' + dayLabel(hist.repetir.fecha) + ' · ' + money(hist.repetir.total) }),
            btn('Repetir el último pedido', 'secondary strong', function () { repeatLast(hist.repetir); }, 'repeat')
          ]));
        }
        clientSection.appendChild(btn('Cambiar cliente', 'ghost', function () { draft.clientId = ''; save(); drawClient(); }));
        return;
      }
      var input = el('input', { class: 'input', type: 'search', placeholder: 'Nombre, calle o localidad', 'aria-label': 'Buscar cliente', autocomplete: 'off' });
      var results = el('div', { style: 'margin-top:10px' });
      clientSection.appendChild(el('div', { class: 'search' }, [icon('search'), input]));
      clientSection.appendChild(results);
      function update() {
        clear(results);
        var q = norm(input.value).split(/\s+/).filter(Boolean);
        var list = cat.clientes.filter(function (c) {
          var hay = norm(c.nombre + ' ' + c.direccion + ' ' + c.localidad + ' ' + c.responsable);
          return q.every(function (t) { return hay.indexOf(t) !== -1; });
        }).slice(0, q.length ? 8 : 5);
        list.forEach(function (c) {
          results.appendChild(el('button', { class: 'list-item', type: 'button', onclick: function () {
            draft.clientId = c.clientId;
            draft.desde = c.desde || '';
            draft.hasta = c.hasta || '';
            draft.recibe = c.responsable || '';
            save(); drawClient(); drawWhen(); updateTotal();
          } }, [el('strong', { text: c.nombre }), el('div', { class: 'small', text: c.direccion + ' · ' + nice(c.localidad) })]));
        });
        if (q.length && !list.length) {
          results.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'No lo encontramos' }),
            btn('Crear cliente nuevo', 'secondary', function () {
              openClienteForm(null, input.value, function (newId) {
                draft.clientId = newId; save();
                S.catalog = null;
                openNuevoPedido();
              });
            }, 'plus')]));
        }
      }
      input.addEventListener('input', update);
      update();
    }

    /* 2. Productos */
    var productSection = el('section', { class: 'step card' }, [el('h2', { class: 'step-title' }, [el('span', { class: 'step-num', text: '2' }), '¿Qué lleva?'])]);
    main.appendChild(productSection);
    cat.productos.forEach(function (p) {
      var line = draft.lines[p.id] || { presentacion: p.precios.CAJA > 0 ? 'CAJA' : 'BULTO', cantidad: 0 };
      var wrap = el('div', { class: 'product' + (line.cantidad > 0 ? ' selected' : '') });
      var qty = el('input', { type: 'number', inputmode: 'numeric', min: '0', step: '1', value: String(line.cantidad || 0), 'aria-label': 'Cantidad de ' + p.nombre });
      var sub = el('div', { class: 'line-total' });
      var seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Presentación de ' + p.nombre });
      ['CAJA', 'BULTO', 'UNIDAD'].forEach(function (pres) {
        if (!(p.precios[pres] > 0)) return;
        seg.appendChild(el('button', { type: 'button', 'aria-pressed': String(line.presentacion === pres), text: nice(pres), onclick: function (e) {
          line.presentacion = pres;
          seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === e.currentTarget)); });
          commit();
        } }));
      });
      function commit() {
        var n = Math.max(0, Math.min(9999, Math.floor(Number(qty.value) || 0)));
        line.cantidad = n;
        if (n > 0) draft.lines[p.id] = line; else delete draft.lines[p.id];
        wrap.className = 'product' + (n > 0 ? ' selected' : '');
        sub.textContent = n > 0 ? n + ' × ' + money(p.precios[line.presentacion]) + ' = ' + money(n * p.precios[line.presentacion]) :
          money(p.precios[line.presentacion]) + ' por ' + line.presentacion.toLowerCase();
        save(); updateTotal();
      }
      qty.addEventListener('input', commit);
      wrap.appendChild(el('div', { class: 'product-name', text: p.nombre }));
      wrap.appendChild(el('div', { class: 'product-controls' }, [seg, el('div', { class: 'stepper' }, [
        el('button', { type: 'button', 'aria-label': 'Restar uno', text: '−', onclick: function () { qty.value = Math.max(0, (Number(qty.value) || 0) - 1); commit(); } }),
        qty,
        el('button', { type: 'button', 'aria-label': 'Sumar uno', text: '+', onclick: function () { qty.value = (Number(qty.value) || 0) + 1; commit(); } })
      ])]));
      wrap.appendChild(sub);
      productSection.appendChild(wrap);
      commit();
    });

    /* 3. Cuándo */
    var whenSection = el('section', { class: 'step card' });
    main.appendChild(whenSection);
    function drawWhen() {
      clear(whenSection);
      whenSection.appendChild(el('h2', { class: 'step-title' }, [el('span', { class: 'step-num', text: '3' }), '¿Cuándo se entrega?']));
      var dateInput = el('input', { class: 'input', type: 'date', value: draft.fecha, 'aria-label': 'Fecha de entrega', min: todayKey(-30) });
      var chips = el('div', { class: 'chips' });
      [['Hoy', todayKey()], ['Mañana', todayKey(1)]].forEach(function (c) {
        chips.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.fecha === c[1]), text: c[0], onclick: function () {
          draft.fecha = c[1]; save(); drawWhen();
        } }));
      });
      dateInput.addEventListener('change', function () { draft.fecha = dateInput.value; save(); drawWhen(); });
      whenSection.appendChild(chips);
      whenSection.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Otro día' }), dateInput]));
      var from = el('input', { class: 'input', type: 'time', value: draft.desde, 'aria-label': 'Desde' });
      var to = el('input', { class: 'input', type: 'time', value: draft.hasta, 'aria-label': 'Hasta' });
      from.addEventListener('change', function () { draft.desde = from.value; save(); });
      to.addEventListener('change', function () { draft.hasta = to.value; save(); });
      whenSection.appendChild(el('div', { class: 'grid2' }, [
        el('label', { class: 'field' }, [el('span', { text: 'Desde' }), from]),
        el('label', { class: 'field' }, [el('span', { text: 'Hasta' }), to])
      ]));
      whenSection.appendChild(el('div', { class: 'field' }, [el('span', { style: 'display:block;font-weight:700;margin:14px 0 6px', text: 'Ese horario es' }),
        chipRow([[false, 'Libre'], [true, 'Fijo']], !!draft.horarioFijo, function (v) { draft.horarioFijo = v; save(); drawWhen(); }, 'Tipo de horario')]));
      var prio = el('div', { class: 'chips' });
      [['NORMAL', 'Normal'], ['URGENTE', 'Urgente'], ['CRÍTICA', 'Crítica']].forEach(function (pr) {
        prio.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.prioridad === pr[0]), text: pr[1], onclick: function () {
          draft.prioridad = pr[0]; save(); drawWhen();
        } }));
      });
      whenSection.appendChild(el('div', { class: 'field' }, [el('span', { style: 'display:block;font-weight:700;margin:14px 0 6px', text: 'Prioridad' }), prio]));
    }

    /* 4. Pago */
    var paySection = el('section', { class: 'step card' });
    main.appendChild(paySection);
    function drawPay() {
      clear(paySection);
      paySection.appendChild(el('h2', { class: 'step-title' }, [el('span', { class: 'step-num', text: '4' }), '¿Te pagó algo ahora?']));
      var chips = el('div', { class: 'chips' });
      [['no', 'No'], ['todo', 'Sí, todo'], ['parte', 'Una parte']].forEach(function (o) {
        chips.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.pago === o[0]), text: o[1], onclick: function () {
          draft.pago = o[0]; save(); drawPay(); updateTotal();
        } }));
      });
      paySection.appendChild(chips);
      if (draft.pago === 'parte') {
        var amount = el('input', { class: 'input', inputmode: 'decimal', value: draft.importe, placeholder: 'Ej: 20000', 'aria-label': 'Importe pagado' });
        amount.addEventListener('input', function () { draft.importe = amount.value; save(); updateTotal(); });
        paySection.appendChild(el('label', { class: 'field' }, [el('span', { text: '¿Cuánto?' }), amount]));
      }
      if (draft.pago !== 'no') {
        var medios = el('div', { class: 'chips' });
        MEDIOS.forEach(function (m) {
          medios.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(draft.medio === m[0]), text: m[1], onclick: function () {
            draft.medio = m[0]; save(); drawPay();
          } }));
        });
        paySection.appendChild(el('div', { class: 'field' }, [el('span', { style: 'display:block;font-weight:700;margin:14px 0 6px', text: '¿Cómo?' }), medios]));
      }
    }

    /* 5. Notas */
    var notes = el('details', { class: 'step card' });
    var recibe = el('input', { class: 'input', value: draft.recibe, maxlength: '80', 'aria-label': 'Quién recibe' });
    var obs = el('textarea', { class: 'input', maxlength: '300', 'aria-label': 'Observaciones' });
    obs.value = draft.observaciones;
    recibe.addEventListener('input', function () { draft.recibe = recibe.value; save(); });
    obs.addEventListener('input', function () { draft.observaciones = obs.value; save(); });
    notes.appendChild(el('summary', { style: 'font-weight:800;font-size:18px;min-height:44px;cursor:pointer', text: 'Notas para la entrega (opcional)' }));
    notes.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Quién recibe' }), recibe]));
    notes.appendChild(el('label', { class: 'field' }, [el('span', { text: 'Observaciones' }), obs]));
    main.appendChild(notes);

    /* Barra de total */
    var totalValue = el('div', { text: money(0) });
    var review = btn('Revisar pedido', 'primary', reviewOrder);
    var bar = el('div', { class: 'totalbar', id: 'totalbar' }, [el('div', { class: 'totalbar-inner' }, [
      el('div', { class: 'sum' }, [el('div', { text: 'Total' }), totalValue]), review
    ])]);
    document.body.appendChild(bar);

    function computeTotal() {
      return Object.keys(draft.lines).reduce(function (sum, id) {
        var p = productsById[id];
        var l = draft.lines[id];
        return p ? sum + l.cantidad * (p.precios[l.presentacion] || 0) : sum;
      }, 0);
    }
    function updateTotal() { if (totalValue) totalValue.textContent = money(computeTotal()); }

    function leave() {
      main.classList.remove('has-totalbar');
      var b = document.getElementById('totalbar');
      if (b) b.remove();
    }
    S.leave = leave;

    function reviewOrder() {
      var problems = [];
      var c = clientsById[draft.clientId];
      var lineIds = Object.keys(draft.lines).filter(function (id) { return productsById[id] && draft.lines[id].cantidad > 0; });
      var total = computeTotal();
      if (!c) problems.push('Elegí el cliente (paso 1).');
      if (!lineIds.length) problems.push('Agregá al menos un producto (paso 2).');
      if (!draft.fecha) problems.push('Elegí la fecha de entrega (paso 3).');
      if (draft.desde && draft.hasta && draft.hasta < draft.desde) problems.push('El horario "hasta" es antes que "desde".');
      if (draft.horarioFijo && (!draft.desde || !draft.hasta)) problems.push('Para un horario fijo hacen falta el "desde" y el "hasta".');
      var paid = draft.pago === 'todo' ? total : draft.pago === 'parte' ? parseMoney(draft.importe) : 0;
      if (draft.pago === 'parte' && (paid === null || paid <= 0)) problems.push('Escribí cuánto te pagó (paso 4).');
      if (paid > total + 0.01) problems.push('El pago es mayor que el total.');
      if (problems.length) {
        openSheet([el('h2', { text: 'Falta completar' }), el('ul', {}, problems.map(function (p) { return el('li', { text: p }); })),
          btn('Entendido', 'primary', closeSheet)], 'Falta completar');
        return;
      }
      draft.requestId = draft.requestId || uuid();
      save();
      var medioText = MEDIOS.filter(function (m) { return m[0] === draft.medio; })[0][1];
      function comisionVenta() {
        if (!lineIds.every(function (id) { return productsById[id].comisiones; })) return [];
        return [row('Comisión estimada', money(lineIds.reduce(function (s, id) { var l = draft.lines[id]; return s + l.cantidad * Number(productsById[id].comisiones[l.presentacion]); }, 0)))];
      }
      var saveBtn = btn('Guardar pedido', 'primary', function () {
        setBusy(saveBtn, 'Guardando…');
        var payload = {
          requestId: draft.requestId, clientId: draft.clientId, fecha: draft.fecha, desde: draft.desde, hasta: draft.hasta, horarioFijo: !!draft.horarioFijo, paradaId: draft.paradaId || '',
          prioridad: draft.prioridad, recibe: draft.recibe, observaciones: draft.observaciones,
          lineas: lineIds.map(function (id) { return { productId: id, presentacion: draft.lines[id].presentacion, cantidad: draft.lines[id].cantidad }; }),
          pagoInicial: paid || 0, medio: paid > 0 ? draft.medio : '', totalEsperado: total
        };
        write('crearPedido', payload, 'Pedido de ' + c.nombre).then(function (res) {
          store('minue.borrador', undefined);
          closeSheet(true);
          leave();
          drawSaved(res);
        }, function (error) {
          unsetBusy(saveBtn);
          err.hidden = false;
          err.textContent = error.code === 'NETWORK' ?
            'No pudimos confirmar que se guardó. El pedido quedó en el teléfono: tocá Reintentar arriba cuando tengas señal. No lo cargues de nuevo.' :
            (error.message || 'No se pudo guardar.');
        });
      });
      var err = el('div', { class: 'error-box', hidden: true });
      openSheet([
        el('h2', { text: '¿Guardamos este pedido?' }),
        el('div', { class: 'summary' }, [
          row('Cliente', c.nombre), row('Entrega', dayLabel(draft.fecha) + (draft.desde ? ' · ' + draft.desde + ' a ' + (draft.hasta || '') : ''))
        ].concat(lineIds.map(function (id) {
          var l = draft.lines[id], p = productsById[id];
          return row(qtyText(l.cantidad, l.presentacion) + ' · ' + p.nombre, money(l.cantidad * p.precios[l.presentacion]));
        }), [row('Total', money(total), true)].concat(comisionVenta(), [row('Pagó ahora', paid > 0 ? money(paid) + ' (' + medioText + ')' : 'Nada'),
          row('Queda debiendo', money(Math.max(0, total - (paid || 0))), true)]))),
        err,
        el('div', { class: 'stack' }, [saveBtn, btn('Seguir editando', 'secondary', closeSheet)])
      ], 'Confirmar pedido');
    }

    drawClient(); drawWhen(); drawPay(); updateTotal();
  }

  function drawSaved(res) {
    S.current = renderPedidos;
    if (S.leave) { S.leave(); S.leave = null; }
    clear(main);
    if (res.repetida) {
      main.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'badges' }, [el('span', { class: 'badge ok', text: 'Ya estaba guardado' })]),
        el('h1', { text: 'Este pedido ya se había guardado' }),
        el('p', { text: 'No se duplicó. Lo podés ver en la lista de pedidos.' }),
        btn('Ver pedidos', 'primary', function () { go('pedidos'); })
      ]));
      return;
    }
    main.appendChild(el('div', { class: 'card' }, [
      checkMark(),
      el('h1', { class: 'centered', text: 'Pedido guardado' }),
      el('div', { class: 'summary' }, [row('Cliente', res.cliente), row('Entrega', dayLabel(res.fecha)), row('Total', money(res.total), true),
        row('Pagó', money(res.pagado)), row('Debe', money(res.saldo), true)]),
      el('div', { class: 'stack' }, [
        res.fecha <= todayKey() ? btn('Ver mi recorrido', 'primary', function () { go('recorrido'); }, 'route') : null,
        btn('Cargar otro pedido', res.fecha <= todayKey() ? 'secondary' : 'primary', function () { openNuevoPedido(); }, 'plus'),
        btn('Ir a Hoy', 'ghost', function () { go('inicio'); })
      ])
    ]));
    window.scrollTo(0, 0);
  }

  /* ================================================================ */
  /* CLIENTES                                                          */
  /* ================================================================ */

  function renderClientes() {
    S.current = renderClientes;
    screen('clientes', {}, function (d) {
      main.appendChild(el('h1', { text: 'Clientes' }));
      var input = el('input', { class: 'input', type: 'search', placeholder: 'Nombre, calle o localidad', 'aria-label': 'Buscar cliente', autocomplete: 'off', value: S.clientQuery || '' });
      var list = el('div', { style: 'margin-top:12px' });
      main.appendChild(el('div', { class: 'search' }, [icon('search'), input]));
      main.appendChild(el('div', { style: 'margin-top:10px' }, [btn('Nuevo cliente', 'secondary', function () { openClienteForm(null, input.value); }, 'plus')]));
      main.appendChild(list);
      function update() {
        S.clientQuery = input.value;
        clear(list);
        var q = norm(input.value).split(/\s+/).filter(Boolean);
        var shown = d.clientes.filter(function (c) {
          var hay = norm(c.nombre + ' ' + c.direccion + ' ' + c.localidad + ' ' + c.responsable);
          return q.every(function (t) { return hay.indexOf(t) !== -1; });
        });
        shown.slice(0, 60).forEach(function (c) {
          list.appendChild(el('button', { class: 'list-item', type: 'button', onclick: function () { renderCliente(c.clientId); } }, [
            el('div', { class: 'row' }, [el('strong', { text: c.nombre }), c.saldo > 0 ? el('span', { class: 'owe', text: 'Debe ' + money(c.saldo) }) : null]),
            el('div', { class: 'small', text: c.direccion + ' · ' + nice(c.localidad) + (c.estado === 'INACTIVO' ? ' · Inactivo' : '') })
          ]));
        });
        if (!shown.length) list.appendChild(el('div', { class: 'empty' }, [el('strong', { text: 'No hay clientes con ese nombre' }), el('span', { text: 'Probá con otra palabra o creá uno nuevo.' })]));
      }
      input.addEventListener('input', update);
      update();
    });
  }

  function renderCliente(clientId) {
    S.current = function () { renderCliente(clientId); };
    markTab('clientes');
    screen('cliente', { clientId: clientId }, function (c) {
      main.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { go('clientes'); } }, [icon('back'), 'Clientes']));
      main.appendChild(el('h1', { text: c.nombre }));
      main.appendChild(el('p', { class: 'sub', text: c.direccion + ' · ' + nice(c.localidad) }));
      main.appendChild(btn('Nuevo pedido para este cliente', 'primary', function () { openNuevoPedido(c.clientId); }, 'plus'));
      var contact = [];
      if (c.telefono) contact.push(linkBtn('tel:' + c.telefono, 'Llamar', 'secondary', 'phone'));
      if (c.whatsapp) contact.push(linkBtn(c.whatsapp, 'WhatsApp', 'secondary', 'chat'));
      if (contact.length) main.appendChild(el('div', { class: 'btn-row' }, contact));
      main.appendChild(el('div', { class: 'btn-row', style: 'margin-top:10px' }, [
        linkBtn(c.mapsUrl, 'Ver en Maps', 'secondary', 'map'),
        btn(c.lat != null ? 'Corregir ubicación' : 'Guardar ubicación', 'secondary', function () {
          openUbicar({ clientId: c.clientId, titulo: c.nombre, direccion: c.direccion + ', ' + c.localidad, lat: c.lat, lng: c.lng,
            cerca: S.hoy && S.hoy.recorrido && S.hoy.recorrido.base, onSaved: function () { renderCliente(clientId); } });
        })
      ]));
      if (c.lat == null) main.appendChild(el('p', { class: 'small', text: 'Sin ubicación guardada: todavía no entra en el cálculo del recorrido.' }));

      main.appendChild(el('div', { class: 'card', style: 'margin-top:16px' }, [el('dl', { class: 'info', style: 'margin:0' }, [
        el('dt', { text: 'Debe' }), el('dd', { class: c.saldo > 0 ? 'owe' : 'paid', text: c.saldo > 0 ? money(c.saldo) : 'Nada' }),
        el('dt', { text: 'Recibe' }), el('dd', { text: (c.dias || 'Sin días') + ' · ' + (c.desde ? c.desde + ' a ' + c.hasta : 'sin horario') }),
        c.responsable ? el('dt', { text: 'Contacto' }) : null, c.responsable ? el('dd', { text: c.responsable }) : null,
        c.telefono ? el('dt', { text: 'Teléfono' }) : null, c.telefono ? el('dd', { text: c.telefono }) : null,
        c.instrucciones ? el('dt', { text: 'Indicaciones' }) : null, c.instrucciones ? el('dd', { text: c.instrucciones }) : null
      ])]));

      var owing = c.pedidos.filter(function (p) { return p.saldo > 0; });
      if (owing.length) {
        main.appendChild(el('h2', { text: 'Pedidos que debe' }));
        owing.forEach(function (p) {
          main.appendChild(el('div', { class: 'card' }, [
            el('div', { class: 'row', style: 'display:flex;justify-content:space-between;gap:12px' }, [
              el('span', { text: dayLabel(p.fecha) + ' · total ' + money(p.total) }), el('span', { class: 'owe', text: money(p.saldo) })]),
            el('div', { style: 'margin-top:10px' }, [btn('Cobrar', 'secondary strong', function () { openCobro(p, function () { renderCliente(clientId); }); }, 'cash')])
          ]));
        });
      }
      main.appendChild(el('h2', { text: 'Últimos pedidos' }));
      if (!c.pedidos.length) main.appendChild(el('p', { class: 'small', text: 'Todavía no tiene pedidos.' }));
      c.pedidos.slice(0, 10).forEach(function (p) { main.appendChild(orderItem(p)); });
      main.appendChild(el('div', { style: 'margin-top:20px' }, [btn('Editar datos del cliente', 'ghost', function () { openClienteForm(c); }, 'edit')]));
    });
  }

  function openClienteForm(existing, prefillName, onSaved) {
    var prev = S.current;
    S.current = function () { openClienteForm(existing, prefillName, onSaved); };
    markTab('clientes');
    var id = ++S.renderId;
    loading();
    var run = function () {
      call('catalogo', {}).then(function (cat) { if (id === S.renderId) draw(cat); }, function (error) { if (id === S.renderId) showError(error, run); });
    };
    run();

    function draw(cat) {
      clear(main);
      var c = existing || { nombre: prefillName || '' };
      var fields = {};
      function field(key, label, attrs) {
        var input = el(attrs && attrs.textarea ? 'textarea' : 'input', Object.assign({ class: 'input', 'aria-label': label }, attrs || {}));
        input.value = c[key] || '';
        fields[key] = input;
        return el('label', { class: 'field' }, [el('span', { text: label }), input]);
      }
      var locSelect = el('select', { class: 'input', 'aria-label': 'Localidad' });
      var locs = cat.listas.localidades.slice();
      if (c.localidad && locs.indexOf(c.localidad) === -1) locs.unshift(c.localidad);
      locSelect.appendChild(el('option', { value: '', text: 'Elegí la localidad' }));
      locs.forEach(function (l) { locSelect.appendChild(el('option', { value: l, text: nice(l), selected: l === c.localidad })); });
      locSelect.appendChild(el('option', { value: '__otra', text: 'Otra…' }));
      var otherLoc = el('input', { class: 'input', placeholder: 'Escribí la localidad', hidden: true, 'aria-label': 'Otra localidad' });
      locSelect.addEventListener('change', function () { otherLoc.hidden = locSelect.value !== '__otra'; if (!otherLoc.hidden) otherLoc.focus(); });
      var DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
      var diasElegidos = DIAS.filter(function (d) { return norm(c.dias).indexOf(norm(d)) !== -1; });
      var diasChips = el('div', { class: 'chips dias-chips', role: 'group', 'aria-label': 'Días que recibe' });
      DIAS.forEach(function (d) {
        var chip = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(diasElegidos.indexOf(d) !== -1), text: d, onclick: function () {
          var i = diasElegidos.indexOf(d);
          if (i === -1) diasElegidos.push(d); else diasElegidos.splice(i, 1);
          chip.setAttribute('aria-pressed', String(i === -1));
        } });
        diasChips.appendChild(chip);
      });
      var diasBox = el('div', { class: 'field' }, [el('span', { text: 'Días que recibe' }), diasChips,
        el('p', { class: 'small', style: 'margin:6px 0 0', text: 'Esos días la app te lo sugiere para el recorrido.' })]);
      fields.dias = { get value() { return DIAS.filter(function (d) { return diasElegidos.indexOf(d) !== -1; }).join(', '); } };
      var err = el('div', { class: 'error-box', hidden: true });
      var saveBtn = btn('Guardar cliente', 'primary', function () {
        var loc = locSelect.value === '__otra' ? otherLoc.value : locSelect.value;
        var data = {};
        Object.keys(fields).forEach(function (k) { data[k] = fields[k].value; });
        data.localidad = loc;
        data.estado = existing ? (fields.estadoActivo && !fields.estadoActivo.checked ? 'INACTIVO' : 'ACTIVO') : 'ACTIVO';
        data.formaPago = existing ? existing.formaPago : '';
        if (!data.nombre.trim() || !data.direccion.trim() || !loc) {
          err.textContent = 'Completá nombre, dirección y localidad.';
          err.hidden = false;
          return;
        }
        setBusy(saveBtn, 'Guardando…');
        write('guardarCliente', { clientId: existing ? existing.clientId : '', rev: existing ? existing.rev : '', cliente: data },
          (existing ? 'Cambios de ' : 'Alta de ') + data.nombre).then(function (res) {
          toast(existing ? 'Cambios guardados.' : 'Cliente creado.');
          S.catalog = null;
          if (onSaved) onSaved(res.clientId);
          else renderCliente(res.clientId);
          if (!existing && !onSaved) {
            openUbicar({ clientId: res.clientId, titulo: data.nombre, direccion: data.direccion + ', ' + nice(loc), auto: true, onSaved: function () { renderCliente(res.clientId); } });
          }
        }, function (error) {
          unsetBusy(saveBtn);
          err.textContent = error.code === 'NETWORK' ? 'No pudimos confirmar que se guardó. Quedó en el teléfono: tocá Reintentar arriba.' : (error.message || 'No se pudo guardar.');
          err.hidden = false;
        });
      });
      main.appendChild(el('button', { class: 'back', type: 'button', onclick: function () { if (prev && existing) renderCliente(existing.clientId); else go('clientes'); } }, [icon('back'), 'Volver']));
      main.appendChild(el('h1', { text: existing ? 'Editar cliente' : 'Nuevo cliente' }));
      main.appendChild(el('div', { class: 'card' }, [
        field('nombre', 'Nombre del comercio *', { maxlength: '80' }),
        field('direccion', 'Dirección (calle y número) *', { maxlength: '120', autocomplete: 'off' }),
        el('label', { class: 'field' }, [el('span', { text: 'Localidad *' }), locSelect]), otherLoc,
        field('telefono', 'Teléfono', { inputmode: 'tel', maxlength: '20' }),
        field('responsable', 'Persona de contacto', { maxlength: '80' }),
        el('div', { class: 'grid2' }, [field('desde', 'Recibe desde', { type: 'time' }), field('hasta', 'Hasta', { type: 'time' })]),
        diasBox,
        field('instrucciones', 'Indicaciones para entregar', { maxlength: '200' }),
        el('details', {}, [el('summary', { style: 'font-weight:700;min-height:44px;margin-top:14px;cursor:pointer', text: 'Más datos (opcional)' }),
          field('whatsappNumero', 'WhatsApp (si es otro número)', { inputmode: 'tel', maxlength: '20' }),
          field('codigoPostal', 'Código postal', { inputmode: 'numeric', maxlength: '10' }),
          field('referencia', 'Referencia de ubicación', { maxlength: '120' }),
          field('observaciones', 'Observaciones', { maxlength: '200', textarea: true })
        ]),
        existing ? (function () {
          var cb = el('input', { type: 'checkbox', checked: existing.estado !== 'INACTIVO', style: 'width:24px;height:24px', 'aria-label': 'Cliente activo' });
          fields.estadoActivo = cb;
          return el('label', { class: 'field', style: 'display:flex;gap:10px;align-items:center' }, [cb, el('span', { style: 'margin:0', text: 'Cliente activo' })]);
        })() : null,
        err,
        el('div', { style: 'margin-top:16px' }, [saveBtn])
      ]));
      // El servidor espera "whatsapp"; el cliente leído lo trae como "whatsappNumero".
      fields.whatsapp = fields.whatsappNumero;
      delete fields.whatsappNumero;
    }
  }

  /* ================================================================ */
  /* COBROS                                                            */
  /* ================================================================ */

  function renderCobros() {
    S.current = renderCobros;
    screen('pendientesCobro', {}, function (d) {
      main.appendChild(el('h1', { text: 'Plata' }));
      if (d.cierre) main.appendChild(cierreCard(d.cierre));
      main.appendChild(el('div', { class: 'card', style: 'margin-top:12px' }, [el('div', { class: 'small', text: 'Te deben en total' }),
        el('div', { class: 'big-amount ' + (d.total > 0 ? 'owe' : 'paid'), text: money(d.total) })]));
      if (!d.pedidos.length) {
        main.appendChild(el('div', { class: 'card empty', style: 'margin-top:12px' }, [el('strong', { text: 'Nadie te debe nada' }), el('span', { text: 'Todos los pedidos están pagados.' })]));
        return;
      }
      var delivered = d.pedidos.filter(function (p) { return p.entregado; });
      var notYet = d.pedidos.filter(function (p) { return !p.entregado; });
      if (delivered.length) {
        main.appendChild(el('h2', { text: 'Ya entregados (' + delivered.length + ')' }));
        delivered.forEach(function (p) { main.appendChild(debtCard(p)); });
      }
      if (notYet.length) {
        main.appendChild(el('h2', { text: 'Por entregar (' + notYet.length + ')' }));
        notYet.forEach(function (p) { main.appendChild(debtCard(p)); });
      }
    });
  }

  /** Cuentas del día: efectivo que tiene que tener, transferencias y quién debe. */
  function cierreCard(c) {
    var medioNombre = function (m) { return m === 'EFECTIVO' ? 'Efectivo en mano' : nice(m); };
    var rows = [];
    c.porMedio.forEach(function (m) { rows.push(row(medioNombre(m.medio), money(m.importe), m.medio === 'EFECTIVO')); });
    if (!rows.length) rows.push(row('Cobrado hoy', money(0)));
    rows.push(row('Entregas de hoy', c.entregadas + (c.pendientes ? ' · te faltan ' + c.pendientes : '')));
    var node = el('div', { class: 'card' }, [
      el('h2', { style: 'margin:0 0 8px', text: 'Tu día' }),
      el('div', { class: 'summary', style: 'margin-top:0' }, rows)
    ]);
    if (c.debenHoy.length) {
      node.appendChild(el('p', { class: 'small', style: 'margin:8px 0 4px', text: 'Quedaron debiendo de lo entregado hoy: ' + money(c.totalDebenHoy) }));
      c.debenHoy.slice(0, 5).forEach(function (x) { node.appendChild(el('div', { class: 'small', text: x.cliente + ' · ' + money(x.saldo) })); });
    }
    var lines = ['Resumen de ' + c.fechaTexto, 'Entregas: ' + c.entregadas + (c.pendientes ? ' (faltan ' + c.pendientes + ')' : '')];
    c.porMedio.forEach(function (m) { lines.push(medioNombre(m.medio) + ': ' + money(m.importe)); });
    if (c.debenHoy.length) lines.push('Te deben: ' + money(c.totalDebenHoy) + ' (' + c.debenHoy.map(function (x) { return x.cliente; }).join(', ') + ')');
    node.appendChild(el('div', { style: 'margin-top:12px' }, [linkBtn(waLink('', lines.join('\n')), 'Compartir resumen por WhatsApp', 'secondary', 'chat')]));
    return node;
  }

  function debtCard(p) {
    return el('div', { class: 'card' }, [
      el('div', { class: 'row', style: 'display:flex;justify-content:space-between;gap:12px;align-items:baseline' }, [
        el('strong', { style: 'font-size:18px', text: p.cliente }), el('span', { class: 'owe', text: money(p.saldo) })]),
      el('div', { class: 'small', text: (p.entregado ? 'Entregado · ' : 'Entrega ') + dayLabel(p.fecha) + ' · Total ' + money(p.total) + ' · Pagó ' + money(p.pagado) }),
      el('div', { style: 'margin-top:10px' }, [btn('Cobrar', 'secondary strong', function () { openCobro(p, renderCobros); }, 'cash')])
    ]);
  }

  /* ================================================================ */
  /* Arranque                                                          */
  /* ================================================================ */

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      if (S.leave) { S.leave(); S.leave = null; }
      go(t.getAttribute('data-tab'));
    });
  });
  document.getElementById('refresh').addEventListener('click', function () { refresh(); renderOutbox(); });
  document.getElementById('fab').addEventListener('click', function () { openNuevoPedido(); });

  var ZOOMS = [1, 1.15, 1.3];
  var zoomIndex = Number(load('minue.zoom', 0)) || 0;
  if (zoomIndex < 0 || zoomIndex >= ZOOMS.length) zoomIndex = 0;
  document.documentElement.style.setProperty('--zoom', String(ZOOMS[zoomIndex]));
  function zoomText() { return zoomIndex === 0 ? 'Letra normal' : zoomIndex === 1 ? 'Letra más grande' : 'Letra muy grande'; }
  function temaTexto() { return document.documentElement.getAttribute('data-tema') === 'claro' ? 'Pantalla oscura' : 'Pantalla clara para el sol'; }
  document.getElementById('tema-label').textContent = temaTexto();
  document.getElementById('tema').addEventListener('click', function () {
    var claro = document.documentElement.getAttribute('data-tema') !== 'claro';
    if (claro) document.documentElement.setAttribute('data-tema', 'claro');
    else document.documentElement.removeAttribute('data-tema');
    store('minue.tema', claro ? 'claro' : '');
    document.getElementById('tema-label').textContent = temaTexto();
  });
  document.getElementById('zoom-label').textContent = zoomText();
  document.getElementById('zoom').addEventListener('click', function () {
    zoomIndex = (zoomIndex + 1) % ZOOMS.length;
    store('minue.zoom', zoomIndex);
    document.documentElement.style.setProperty('--zoom', String(ZOOMS[zoomIndex]));
    document.getElementById('zoom-label').textContent = zoomText();
  });

  /* Menú lateral */
  var drawer = document.getElementById('drawer');
  var drawerBackdrop = document.getElementById('drawer-backdrop');
  var menuButton = document.getElementById('menu');

  function openDrawer() {
    drawer.hidden = false;
    drawerBackdrop.hidden = false;
    menuButton.setAttribute('aria-expanded', 'true');
    document.body.classList.add('locked');
    document.getElementById('drawer-close').focus();
  }

  function closeDrawer() {
    if (drawer.hidden) return;
    drawer.hidden = true;
    drawerBackdrop.hidden = true;
    menuButton.setAttribute('aria-expanded', 'false');
    if (sheet.hidden) document.body.classList.remove('locked');
    menuButton.focus();
  }

  menuButton.addEventListener('click', openDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });
  document.querySelectorAll('.drawer-item[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { closeDrawer(); go(b.getAttribute('data-go')); });
  });
  if (WEB) {
    document.getElementById('logout').hidden = false;
    document.getElementById('logout').addEventListener('click', function () { closeDrawer(); window.MINUE_AUTH.signOut(); });
  }

  function netStatus() { document.getElementById('net').hidden = navigator.onLine !== false; }
  window.addEventListener('online', function () { netStatus(); if (outbox().length) flushOutbox(); });
  window.addEventListener('offline', netStatus);
  netStatus();

  var originalGo = go;
  go = function (tab) {
    if (S.leave) { S.leave(); S.leave = null; }
    originalGo(tab);
  };

  function start() {
    if (WEB && WEB.email) USER = WEB.email;
    if (WEB) {
      S.rol = load('minue.rol', '');
      document.getElementById('menu-catalogo').hidden = false;
      document.getElementById('menu-panel').hidden = false;
      document.getElementById('menu-ajustes').hidden = S.rol !== 'admin';
      call('yo').then(function (y) {
        S.rol = y.rol;
        store('minue.rol', y.rol);
        document.getElementById('menu-ajustes').hidden = y.rol !== 'admin';
      }, function () { /* sin señal: queda lo último conocido */ });
    }
    renderOutbox();
    go(WEB && !load('minue.guia2', '') ? 'ayuda' : 'inicio');
    if (outbox().length && navigator.onLine !== false) flushOutbox();
  }
  if (WEB) window.MINUE_START = start; else start();
  if (window.MINUE_PREVIEW) window.MINUE_APP = { go: go };
})();
</script>

<script>/*
 * MINUÉ · inicio de sesión con usuario y contraseña (Supabase Auth, sin librerías externas).
 * La sesión queda en este teléfono y se renueva sola. Los permisos los decide la base de datos, nunca esta página.
 */
(function () {
  'use strict';
  var cfg = window.MINUE_WEB;
  var KEY = 'minue.sesion';
  var session = read();
  var started = false;
  var overlay = null;
  var refreshing = null;

  function read() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() {
    try {
      if (session) localStorage.setItem(KEY, JSON.stringify(session));
      else localStorage.removeItem(KEY);
    } catch (e) { /* sin almacenamiento */ }
  }

  function fresh() { return session && session.exp * 1000 > Date.now() + 60000; }

  function keep(data) {
    session = {
      access: data.access_token, refresh: data.refresh_token,
      exp: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600),
      email: data.user && data.user.email ? data.user.email : (session && session.email) || ''
    };
    save();
  }

  function auth(path, body, token) {
    return fetch(cfg.url + '/auth/v1/' + path, {
      method: path === 'user' ? 'PUT' : 'POST',
      headers: { apikey: cfg.key, 'Content-Type': 'application/json', Authorization: 'Bearer ' + (token || cfg.key) },
      body: JSON.stringify(body || {})
    });
  }

  function startApp() {
    if (started) return;
    started = true;
    cfg.email = session.email;
    window.MINUE_START();
  }

  function node(tag, attrs, text) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text) n.textContent = text;
    return n;
  }

  var card = null;

  function frame(title, message, subtitle) {
    if (!overlay) {
      overlay = node('div', { id: 'login', class: 'login', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'login-title' });
      document.body.appendChild(overlay);
    }
    while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
    overlay.hidden = false;
    card = node('div', { class: 'login-card' });
    overlay.appendChild(card);
    card.appendChild(node('img', { class: 'login-logo', alt: 'MINUÉ', src: 'logo-login.png' }));
    card.appendChild(node('h1', { id: 'login-title' }, title));
    if (subtitle) card.appendChild(node('p', { class: 'login-sub' }, subtitle));
    var note = node('p', { class: 'login-msg', role: 'alert' }, message || '');
    note.hidden = !message;
    card.appendChild(note);
    return note;
  }

  function field(form, label, attrs) {
    var box = node('label', { class: 'login-field' });
    box.appendChild(node('span', {}, label));
    var input = node('input', attrs);
    box.appendChild(input);
    form.appendChild(box);
    return input;
  }

  var OJO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var OJO_TACHADO = OJO.replace('</svg>', '<path d="M4 4l16 16"/></svg>');

  /** Contraseña con ojito para verla y aviso de mayúsculas activadas. */
  function passwordField(form, label, attrs) {
    var input = field(form, label, attrs);
    var box = input.parentNode;
    box.classList.add('con-ojo');
    var eye = node('button', { type: 'button', class: 'login-ojo', 'aria-label': 'Mostrar contraseña', 'aria-pressed': 'false' });
    eye.innerHTML = OJO;
